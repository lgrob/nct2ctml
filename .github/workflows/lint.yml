# Lint, format and type check. Tool versions come from requirements-dev.txt,
# their settings from pyproject.toml, so this runs exactly what `ruff check .`,
# `ruff format --check .` and `mypy` run locally.
name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .

  # Type check (pyproject.toml [tool.mypy], non-strict: annotated functions
  # are checked). Needs the project's packages installed, for their types.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - name: mypy
        run: mypy
