status: open to accrual
summary: "Group A: To determine if the event-free-survival of patients with de-novo\
  \ AML other than APL can be improved with the therapeutic use of CPX-351\nGroup\
  \ B: To determine the initial efficacy of Gemtuzumab-Ozogamicin when added to standard\
  \ chemotherapy backbone in children with relapsed or refractory AML (CBF-AML will\
  \ receive standard therapy: IDA-FLA)\nGroup C: To compare GVRDS in patients treated\
  \ with Treosulfan-based conditioning regimen compared with those treated with BuCyMel.\
  \ GVRDS is a composite endpoint. Events included in the composite\nendpoint GVRDS\
  \ are:\n\u25AA Acute GvHD grade 3-4 (G)\n\u25AA Chronic GvHD (moderate and severe)\
  \ (G)\n\u25AA VOD Grad 3 or 4 (V)\n\u25AA Clinical or Molecular Relapse (R)\n\u25AA\
  \ Death from any cause (D)\n\u25AA Diagnosis of a second malignant neoplasm (S)\n\
  All Groups: To collect samples for biological and toxicity studies"
