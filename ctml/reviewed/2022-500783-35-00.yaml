prior_treatment_requirements:
- '1. All Groups: Understand and voluntarily provide written permission of parental/legal
  representative(s) to the ICF prior to conducting any study related assessments/procedures,
  also concerning data and biomaterial transfer according to ICH/GCP and national/local
  regulations'
- '10. Group C: Patients with AML and indication for first allogenic HSCT'
- '11. Group C: Age at time of inclusion from 1 month (28 days) to less than 18 years
  at diagnosis; up to 21 years at time of HSCT'
- '12. Group C: Criteria for allogeneic HSCT: o in AML complete remission (CR) o available
  MSD, MFD or MUD; matched is defined as at least 9/10 after 4 digit typing for HLA-A,
  B, C, DRB1, DQB1 loci'
- '2. All Groups: Able to adhere to the study visit schedule and other protocol requirements'
- '3. All Groups: Negative serum pregnancy tests for females of child-bearing potential
  within 10 days prior to treatment'
- '4. Group A: Diagnosis of de-novo AML (according to WHO classification 2016)'
- '5. Group A: Acute leukemia of ambiguous lineage (MPAL; according to WHO classification
  2016: acute undifferentiated leukemia (AUL, bilineal leukemia; biphenotypic leukemia,
  dominant myelogenous; lineage switch)'
- '6. Group A: Children and adolescents < 18 years of age at start of initial chemotherapy'
- '7. Group A: Acceptance that vaccination with live vaccines is not possible while
  participating in the trial'
- '8. Group B: Patients with first relapsed (including relapse after SCT) or primary
  refractory AML'
- '9. Group B: Children and adolescents < 18 years of age at start of initial chemotherapy
  and < 21 years of age at start of this relapsed AML treatment'
- 'Exclude - 1. All Groups: Existing syndromes which exclude treatment including Fanconi
  anemia or other chromosomal instability syndromes'
- 'Exclude - 10. All Groups: Female and male subjects with child-bearing potential
  who avoid using highly effective contraconceptive measure(ment)s'
- 'Exclude - 11. All Groups: Hypersensitivity to the active substance or other excipients
  contained in the investigational medical product listed in the summary of product
  characteristics (SmPC) or Investigators Brochure (IB)'
- 'Exclude - 12. Group A: Previous therapy with cytostatic medicines of more than
  14 days and other than specified in protocol as allowed prephase'
- "Exclude - 13. Group A: Diagnosed Wilson\u2019s Disease"
- 'Exclude - 14. Group B: Fractional Shortening at echocardiography below 29%'
- "Exclude - 15. Group B: A Karnofsky performance status < 40% (children \u2265 16\
  \ years) or a Lansky performance status of < 40% (children < 16 years) before start\
  \ of the first course"
- 'Exclude - 16. Group B: Impaired liver function: Bilirubin > 3 times upper normal
  limit; transaminases > 3 times upper normal limit'
- 'Exclude - 17. Group B: History of VOD'
- 'Exclude - 18. Group B: Renal impairment with creatinine < 30 ml/min'
- 'Exclude - 19. Group B: Decompensated haemolytic anaemia'
- 'Exclude - 2. All Groups: Patients with trisomy 21 and ML-DS and/or transient myeloproliferative
  syndrome'
- "Exclude - 20. Group C: A Karnofsky performance status < 60% (children \u2265 16\
  \ years) or a Lansky performance status of < 60% (children < 16 years) before start\
  \ of the Group treatment"
- 'Exclude - 21. Group C: Treatment with cytotoxic drugs within 10 days prior to planned
  study drug administration'
- "Exclude - 22. Group C: Impaired liver function: Bilirubin \u2265 3 times upper\
  \ normal limit; transaminases \u2265 5 times upper normal limit"
- 'Exclude - 23. Group C: Renal impairment with creatinine < 30 ml/min'
- "Exclude - 24. Group C: Cardiac insufficiency requiring treatment; LVEF \u2264 35%\
  \ (for patients with history of cardiac disease or anthracycline exposure)"
- "Exclude - 25. Group C: Impaired pulmonary function: PO2 \u2264 70 mm Hg or DLCO\
  \ \u2264 60%"
- 'Exclude - 26. Group C: Requirement of supplementary continuous oxygen'
- 'Exclude - 27. Group C: Symptomatic involvement of CNS: leukemic infiltration not
  cleared by prior intrathecal chemotherapy and/or cranial radiotherapy'
- 'Exclude - 28. Group C: Other disease, comorbidity or condition that would severely
  limit life expectancy'
- 'Exclude - 3. All Groups: Patients with an acute promyelocytic leukemia (APL), AML
  with t(15;17)'
- 'Exclude - 4. All Groups: Treatment-related or secondary AML'
- 'Exclude - 5. All Groups: Symptomatic cardiac dysfunction (CTCAE 5.0 Grade 3 or
  4)'
- 'Exclude - 6. All Groups: Any other organ dysfunction (CTCAE 5.0 Grade 4) that will
  interfere with the administration of the therapy according to this protocol'
- 'Exclude - 7. All Groups: Evidence of uncontrolled invasive fungal infection or
  other severe systemic infection requiring treatment doses of systemic/parenteral
  therapy including known active viral infection with human immunodeficiency virus
  (HIV) or Hepatitis Type B and C'
- 'Exclude - 8. All Groups: Participation in another clinical trial with an intervention
  interfering with the aims of this trial'
- 'Exclude - 9. All Groups: Pregnant or breast-feeding patients'
