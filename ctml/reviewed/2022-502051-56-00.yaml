prior_treatment_requirements:
- 1. Able to understand the study procedures and agree to participate in the study
  by providing written informed consent (by participant or legally authorized representative),
  and assent when applicable.
- "2. Body weight \u2265 11 kg at time of randomization."
- "3. Histologically diagnosed H3 K27M-mutant diffuse glioma (new diagnosis). Detection\
  \ of a missense K27M mutation in any histone H3-encoding gene detected by testing\
  \ of tumor tissue (IHC or NGS in a CLIA-certified or equivalent laboratory). [Site\
  \ to provide (as available): \u2265 11 unstained FFPE slides from tumor tissue.]"
- "4. At least one, high-quality, contrast-enhanced MRI of the brain obtained prior\
  \ to starting radiotherapy for submission to sponsor\u2019s imaging vendor for central\
  \ read. For participants who had a surgical resection, this scan must be post-resection;\
  \ for participants who did not have a resection, this scan may be pre- or post-biopsy."
- 5. At least one, high-quality, contrast-enhanced MRI of the brain obtained 2 to
  6 weeks after completion of frontline radiotherapy. [Site to also provide all available
  MRIs completed prior to initiating treatment with study intervention.]
- 6. Received standard frontline radiotherapy within 2 to 6 weeks prior to randomization.
  Standard frontline radiotherapy is defined as a dose of 54 to 60 Gy at 1.8 to 2.2
  Gy/fraction. Radiotherapy must be initiated within 12 weeks from initial diagnosis
  of H3 K27M-mutant diffuse glioma and within 8 weeks of most recent surgical resection/biopsy.
- "7. Karnofsky Performance Status or Lansky Performance Status \u2265 70 at time\
  \ of randomization."
- "8. Stable or decreasing dose of corticosteroids and anti-seizure medications for\
  \ 7 days prior to randomization, if applicable. Stable steroid dose is defined as\
  \ \u22642 mg/day increase (based on dexamethasone dose or equivalent dose of an\
  \ alternative steroid)."
- Exclude - 1. 1. Primary spinal tumor
- Exclude - 10. 10. QTc > 480 msec (based on mean from triplicate electrocardiograms)
  during screening.
- Exclude - 11. 11. Known hypersensitivity to any excipients used in the study intervention
  formulation.
- Exclude - 12. 12. Pregnant, breastfeeding, or planning to become pregnant while
  receiving study intervention or within 3 months after the last dose. Participants
  of childbearing potential must have a negative serum pregnancy test within 72 hours
  prior to receiving the first dose of study intervention.
- Exclude - 13. 13. Uncontrolled intercurrent illness including, but not limited to,
  ongoing or active infection requiring systemic therapy or psychiatric illness/social
  situations that would limit compliance with study requirements.
- Exclude - 14. 14. Any other condition (eg, medical, psychiatric, or social) that,
  in the opinion of the investigator, may interfere with participant safety or the
  ability to complete the study according to the protocol.
- Exclude - 2. 2. Diffuse intrinsic pontine glioma (DIPG), defined as tumors with
  a pontine epicenter and diffuse involvement of the pons.
- Exclude - 3. 3. Evidence of leptomeningeal spread of disease or cerebrospinal fluid
  dissemination.
- Exclude - 4. 4. Any known concurrent malignancy.
- Exclude - 5. 5. New lesion(s) outside of the radiation field.
- Exclude - 6. 6. Received whole-brain radiotherapy.
- Exclude - 7. 7. Received proton therapy for glioma.
- 'Exclude - 8. 8. Use of any of the following treatments within the specified time
  periods prior to randomization: a. Dordaviprone (ONC201) or ONC206 at any time;
  b. bevacizumab (includes biosimilars) at any time; c. Temozolomide within past 3
  weeks; d. Tumor treating fields at any time; e. DRD2 antagonist within past 2 weeks;
  f. Any investigational therapy within past 4 weeks; g. Strong CYP3A4/5 inhibitors
  within 3 days; h. Strong CYP3A4/5 inducers (includes enzyme-inducing antiepileptic
  drugs) within 2 weeks.'
- "Exclude - 9. 9. Laboratory test results meeting any of the following parameters\
  \ within 2 weeks prior to randomization: a. Absolute neutrophil count <1.0 \xD7\
  \ 10^9/L or platelets <75 \xD7 10^9/L; b. Total bilirubin >1.5 \xD7 upper limit\
  \ of normal (ULN) (participants with Gilbert\u2019s syndrome may be included with\
  \ total bilirubin >1.5 \xD7 ULN if direct bilirubin is \u22641.5 \xD7 ULN); c. Aspartate\
  \ aminotransferase (AST) or alanine aminotransferase (ALT) >2.5 \xD7 ULN; d. Creatinine\
  \ clearance \u226460 mL/min as calculated by the Cockcroft Gault equation (or estimated\
  \ glomerular filtration rate <60 mL/min/1.73 m2)."
