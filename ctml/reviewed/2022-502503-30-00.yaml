prior_treatment_requirements:
- 1. Patients with newly diagnosed B- precursor ALL or B-cell MPAL (single lineage)
  according to the WHO classification of tumours of haematopoietic and lymphoid tissues
  (revised 4th edition 2017, with KMT2A-rearrangement.
- "2. \u2264 365 days of age at the time of diagnosis of ALL."
- 3. Written informed consent of the parent(s) or other legally authorized guardian
  of the patient according to local law and regulations.
- Exclude - 1. KMT2A-wildtype patients.
- Exclude - 10. Down syndrome
- Exclude - 11. Multilineage MPAL
- Exclude - 2. Treatment with systemic corticosteroids (equivalent prednisone >10
  mg/m2/day) for more than one week and/or any chemotherapeutic agent in the 4-week
  interval prior to diagnosis. Patients who received corticosteroids by aerosol are
  eligible for the study.
- Exclude - 3. T-ALL.
- Exclude - 4. Age > 365 days at the time of diagnosis.
- Exclude - 5. Relapsed ALL.
- 'Exclude - 6. Additional exclusion criteria for blinatumomab: 1. CD19 negative B-precursor
  ALL at diagnosis'
- 'Exclude - 7. Additional exclusion criteria for blinatumomab: 2. CNS involvement
  (CNS2/CNS3/TLP+ status) at the EOI. Patients with CNS disease at the time of diagnosis
  are eligible if CNS1 status is achieved prior to the start of the first blinatumomab
  cycle (lumbar puncture at ~day 33 of induction).'
- 'Exclude - 8. Additional exclusion criteria for blinatumomab: 3. Proven hypersensitivity
  to the active substance or any of the excipients in blinatumomab.'
- 'Exclude - 9. Additional exclusion criteria for blinatumomab: 4. Patients who have
  received a live vaccine 28 days prior to blinatumomab administration or plan to
  receive a live vaccine prior to Bcell recovery after the last dose of blinatumomab.'
