summary: To determine the recommended Phase 2 dose (RP2D) of regorafenib in combination with standard
  backbone chemotherapy of VDC/IE in patients with newly diagnosed metastatic (other than lungs and/or
  pleura only) Ewing sarcoma.
prior_treatment_requirements:
- Any histologically and genetically confirmed Ewing sarcoma of bone or soft tissue, or round cell sarcomas
  which are ‘Ewing’s-like’ but negative for EWSR1 gene rearrangement
- Subject must be able to swallow and retain oral medication.
- Written informed consent from the patient and/or the parent/legal guardian, according to local, regional
  or national regulation prior to any study specific procedures.
- Patients must be affiliated to a social security system or beneficiary of the same, as per local regulatory
  requirements (France only)
- Metastatic disease
- Age ≥2 years and <50 years (from second birthday to 49 years 364 days)
- "Patient assessed as medically fit to receive the Ewing sarcoma standard multimodal treatment and regorafenib,\
  \ including: -\tAbsolute Neutrophil Count (ANC) ≥ 0.75x109/L, platelets ≥ 75x109/L. -\tAlanine aminotransferase\
  \ (ALT), and aspartate aminotransferase (AST) ≤ 5×ULN  -\tBilirubin ≤ 2×ULN -\tCreatin"
- Adequate cardiac function as evidenced by left ventricular ejection fraction (LVEF) ≥50%) at baseline,
  as determined by echocardiography
- 'Adequately controlled blood pressure (BP) with or without antihypertensive medications, defined as:
  a BP <95th percentile for sex, age, and height at screening (as per National Heart Lung and Blood Institute
  [NHLBI] guidelines) and no change in antihypertensive medications within 1 week prior to Cyc'
- No prior treatment for Ewing sarcoma other than surgery
- Negative pregnancy test for female patients of childbearing potential within 7 days prior to study registration
- Patient agrees to use highly effective contraception during therapy and for 12 months after last trial
  treatment (females) or 6 months after last trial treatment (males), where applicable
