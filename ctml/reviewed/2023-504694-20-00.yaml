      # Curator note (2026-09-26): genomic block removed. In the protocol the
      # cytogenetic high-risk features (KMT2A::AFF1, TCF3::PBX1, TCF3::HLF,
      # hypodiploidy <40, TP53 mutation/deletion) are one of several routes into
      # Stratum 4 only (1st VHR relapse); early, 2nd+, post-HSCT relapse and
      # refractory disease qualify without them, and strata 1A/1B have no genomic
      # criterion. As a required AND they would drop most eligible patients.
      # Lab notes for Stratum 4 if used: KMT2A partner must be identified (not
      # break-apart FISH alone); TCF3::HLF is missed by PBX1-only RT-PCR panels;
      # masked hypodiploidy needs allele-level (BAF/CN-LOH) data; TP53 origin
      # (germline vs somatic), VAF and CN definition are not specified.
