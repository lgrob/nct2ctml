  count ≥ 1 x 109/L - Platelets ≥ 100 x 109/L  - Haemoglobin ≥ 8.0 g/dL (a hemoglobin of l
- For FOSTER-CabOS (first randomization) - 12. Patients who are therapeutically treated with an agent
  such as warfarin or heparin/ Low-molecular-weight heparin (LMWH) will be allowed to participate provided
  that no prior evidence of underlying abnormality in coagulation parameters exists.
- For FOSTER-CabOS (first randomization) - 13. Women of childbearing potential or young women of chilbearing
