summary: "For FOSTER evolving study platform: To assess the 3-year event-free survival (EFS) rate of the\
  \ cohort overalldifferent treatment sequences.\nFor FOSTER-CabOS (first randomization) : To assess efficacy\
  \ in terms of EFS of cabozantinib compared to best supportive care (BSC) as maintenance therapy after\
  \ first-line chemotherapy considering EFS improvement in one or both of the following datasets : \n\
  - patients in complete remission (CR) at the end of first-line therapy (stratum-1), \n-  the whole randomised\
  \ dataset, including patients with residual persistent stable disease after first-line treatment (non-resectable\
  \ primary tumour, or metastatic disease not be completely resected), i.e. strata 1 and 2."
prior_treatment_requirements:
- For FOSTER evolving study platform - 1. Newly diagnosed, biopsy-proven, high-grade osteosarcoma
- For FOSTER-CabOS (first randomization) - 5. Performance status < 2 for patient adult, or >70 using Karnofsky
  or Lansky performance scores.
- For FOSTER-CabOS (first randomization) - 6. Interval between the last treatment either chemotherapy
  administration or surgical procedures or radiotherapy or thermoablation, (whichever occurred last) and
  the date of randomisation should be at least 4 weeks but no longer than 2 months
- For FOSTER-CabOS (first randomization) - 7. Disease in complete remission or with residual persistent
  stable disease according to RECIST criteria before randomisation (please refer 7.3.4 for the definition
  of the residual persistent stable disease)
- For FOSTER-CabOS (first randomization) - 8. Patient fit to undergo protocol treatment and follow-up
- 'For FOSTER-CabOS (first randomization) -9. Adequate cardiac function: Left Ventricular Ejection Fraction
  (LVEF) ≥50% and/or fractional shortening (FS) >28% at baseline as determined by echocardiography or
  multigated acquisition (MUGA) scan (performed only if echocardiography is not feasible)'
- 'For FOSTER-CabOS (first randomization) - 10. Adequately controlled blood pressure (BP) with or without
  antihypertensive medications: BP 95th percentile for sex, age and height/length at screening (as per
  NHLBI (National Heart, Lung and Blood Institute) guidelines) and no change in antihypertensive m'
