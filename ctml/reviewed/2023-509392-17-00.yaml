summary: 'SR Arm induction:Improvement of EFS probability with InO versus ALLR3-Mitox

  SR-MRD good response consolidation: Improvement of 4 years DFS with 3 courses of blinatumomab

  HR Arm with CR2 consolidation: DFS non-inferiority with one consolidation chemotherapy course HC1 before
  blinatumomab compared to historical controls with 2 consolidation courses HC1 and 2

  Isolated extramedullary relapses: EFS improvement with blinatumomab in late consolidation compared to
  historical controls'
prior_treatment_requirements:
- 'All study questions: Confirmed diagnosis of 1st relapsed B-cell precursor ALL'
- 'All study questions: Start of treatment falling into the study period'
- 'Meeting SR criteria: No previous history of veno-occlusive disease (VOD)/ sinusoidal obstruction syndrome
  (SOS)'
- 'All study questions: No participation in other clinical trials 30 day prior to study enrolment that
  interfere with this protocol, except trials for primary ALL'
- 'Specific for SR induction randomization: Meeting SR criteria'
- 'Meeting SR criteria: BM involvement (≥ 1% leukemic blasts)'
- 'Meeting SR criteria: CD22 positive ALL (>80% confirmed by flow-cytometry)'
- 'Specific for SR MRD poor response consolidation: Meeting SR criteria with bone marrow involvement at
  relapse diagnosis'
- 'Specific for SR MRD poor response consolidation: M1/CR2 and MRD ≥ 10-4 after induction'
- 'Specific for SR MRD poor response consolidation: CD19 positive ALL at relapse (>10%)'
- 'Specific for SR MRD good response consolidation: Meeting SR criteria with bone marrow involvement at
  relapse diagnosis'
- 'Specific for HR consolidation arm: M1/CR2 after induction therapy'
