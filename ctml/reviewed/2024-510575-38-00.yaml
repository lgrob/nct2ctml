status: open to accrual
summary: 'Treatment Arm I: BsAb: Estimate the clinical efficacy of BsAb treatment
  in patients with relapsed or refractory B-NHL in either first (only one prior line
  of therapy) or subsequent relapse (more than one prior line of therapy)

  Treatment Arm II: ADC with standard chemotherapy: Estimate the clinical efficacy
  of ADC treatment with modified R-ICE (rituximab, ifosfamide, carboplatin, etoposide
  and dexamethasone) chemotherapy in patients with relapsed or refractory B-NHL in
  first (only one prior line of therapy) or subsequent relapse (more than one prior
  line of therapy)

  Treatment Arm III: CAR T-cells: Estimate the efficacy of CAR T-cell therapy in relapsed
  or refractory BNHL patients who have CAR T-cell product available'
