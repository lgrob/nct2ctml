prior_treatment_requirements:
- "1. Histologically proven mature high-grade B-NHL classified according to either:\
  \ o the 5th edition of the World Health Organisation (WHO) Classification of Haematolymphoid\
  \ Tumours (WHO-HAEM5), 2022 (diffuse large B-cell lymphoma - not otherwise specified\
  \ (DLBCL - NOS), high-grade B-cell lymphoma with MYC and BCL-2 rearrangements, primary\
  \ mediastinal large B-cell lymphoma, Burkitt\u2019s lymphoma, and high-grade B-cell\
  \ lymphoma - NOS) at initial diagnosis; or o the revised 4th edition of the WHO\
  \ Classification of Tumours of Haematopoietic and Lymphoid Tissue, 2017 (diffuse\
  \ large B-cell lymphoma (DLBCL), Burkitt lymphoma/leukaemia or Burkitt-like lymphoma\
  \ with 11q aberration, primary mediastinal large B-cell lymphoma (PMLBL), high-grade\
  \ B-cell lymphoma with MYC and BCL2 and/or BCL6 rearrangements and high-grade B-cell\
  \ lymphoma - NOS) at initial diagnosis"
- '10. Radiologically and/or histologically proven B-NHL in first relapse (only one
  prior line of therapy) or subsequent relapse (more than one prior line of therapy)
  or refractory B-NHL. In the following circumstances biopsy is mandated: o Relapsed
  or refractory disease following previous targeted therapy; biopsy required to confirm
  continuing target positivity (see individual treatment arms for specific relevant
  targets), confirmed by immunohistochemistry or flow cytometry o Relapsed disease
  occurring more than two years after previous therapy; biopsy required to confirm
  relapsed disease o Relapsed or refractory disease following previous therapy within
  the Glo-BNHL platform; biopsy required to confirm relapsed disease o Partial Response
  (PR) to previous therapy; biopsy required to confirm active residual disease'
- "11. Evaluable disease as per the Revised International Paediatric Non-Hodgkin Lymphoma\
  \ Staging System (Appendix 9), including: o at least one bi-dimensionally measurable\
  \ nodal lesion >1.5 cm in its longest dimension; o or at least one bi-dimensionally\
  \ measurable extra-nodal lesion >1.0 cm in its longest dimension on computerised\
  \ tomography (CT) or Magnetic Resonance Imaging (MRI); o or bone marrow involvement\
  \ (\u226525% involvement from bone marrow, if only site of disease. Any standard\
  \ method of assessment is acceptable i.e. cytomorphology, flow cytometry and/or\
  \ immunohistochemistry); o or, dependent on treatment arm, evaluable Central Nervous\
  \ System (CNS) only disease (evaluable by imaging or Cerebrospinal Fluid (CSF) analysis)"
- "12. Aged from birth to \u226425 years old at the time of trial entry"
- "13. Performance status \u226550 using Karnofsky or Lansky performance scores"
- "14. Life expectancy of \u22658 weeks"
- "15. Adequate bone marrow function documented by: o Platelet count \u226550 x 10^9/L\
  \ (no platelet transfusion therapy within seven days prior to treatment) unless\
  \ bone marrow involvement o Absolute neutrophil count (ANC) \u22650.75 x 10^9/L\
  \ (no granulocyte colony stimulating factor within 2 days prior to treatment) unless\
  \ bone marrow involvement"
- 16. Documented negative pregnancy test for female patients of childbearing potential
  within seven days prior to trial entry
- 17. Patients of reproductive potential must agree to use effective contraception
  whilst on trial treatment and for 12 months following treatment discontinuation.
  - o Patients of reproductive potential using oral hormonal contraception must use
  an additional barrier method such as condoms whilst on trial treatment and for 12
  months following treatment discontinuation (see Appendix 2 for details).
- 18. Patients of reproductive potential must agree not to donate sperm or eggs whilst
  on trial treatment and for 12 months following treatment discontinuation
- 2. Written informed consent given by patient and/or parents/legal representative
- '3. Treatment Arm I: Patients of reproductive potential must agree not to donate
  sperm or eggs whilst on trial treatment and for 6 months following treatment discontinuation'
- '4. Treatment Arm I: Patients of reproductive potential using oral hormonal contraception
  must use an additional barrier method such as condoms whilst on trial treatment
  and for 12 months following treatment discontinuation'
- "5. Treatment Arm I: Adequate renal function, by measured creatinine clearance >45\
  \ ml/min (if creatinine levels are normal for the patient\u2019s age, estimated\
  \ creatinine clearance is sufficient. This must be estimated using the Cockroft-Gault\
  \ Equation)"
- "6. Treatment Arm I: Adequate hepatic function documented by: o Alanine aminotransferase\
  \ (ALT) \u22645 x upper limit of normal (ULN); if ALT not measured, aspartate aminotransferase\
  \ (AST) \u22645 x ULN (ALT or AST <5 x ULN if attributed to lymphoma infiltration\
  \ of liver) o Total bilirubin \u22641.5 x ULN \uF0A7 Patients with known Gilbert\
  \ syndrome will be excluded if the total bilirubin value is >4 x ULN for the local\
  \ general population"
- '7. Treatment Arm I: Patients who have received CAR T-cell therapy or other cellular
  therapies more than 28 days prior must demonstrate recovery from acute toxicities
  and have measurable disease'
- '8. Treatment Arm II: Adequate renal function, by measured glomerular filtration
  rate (GFR) >60 ml/min/1.73 m^2 (estimated GFR may alternatively be used, but must
  be based on cystatin C)'
- "9. Treatment Arm II: Adequate hepatic function documented by: o Alanine aminotransferase\
  \ (ALT) \u22642.5 x upper limit of normal (ULN); if ALT not measured, aspartate\
  \ aminotransferase (AST) \u22642.5 x ULN (ALT or AST <5 x ULN if attributed to lymphoma\
  \ infiltration of liver) o Alkaline phosphatase (ALP) \u2264 2.5 x ULN (<5 x ULN\
  \ if attributed to lymphoma infiltration of liver) o Total bilirubin \u22641.5 x\
  \ ULN \uF0A7 Patients with known Gilbert syndrome will be excluded if the total\
  \ bilirubin value is >4 x ULN for the local general population"
- Exclude - 1. B-cell Acute Lymphoblastic Leukaemia (B-ALL)/B-cell Lymphoblastic Lymphoma
  (B-LBL)
- Exclude - 10. Uncontrolled concomitant infection. Severe infection (such as sepsis,
  pneumonia, etc.) should be clinically controlled at the time of trial entry
- Exclude - 11. Known HIV positivity
- 'Exclude - 12. Hepatitis B carrier status, history of Hepatitis B Virus or positive
  serology. A patient is considered as a Hepatitis B Virus carrier or to have (had)
  Hepatitis B Virus infection in case of: o Unimmunized and HBsAg and/or anti-HBs
  antibody and/or anti-HBc antibody positive, or o Immunized and HBsAg and/or anti-HBc
  antibody positive'
- Exclude - 13. Live vaccine within 28 days prior to trial entry
- Exclude - 14. Known history of hypersensitivity to any of the treatments or excipients
- 'Exclude - 15. Treatment Arm I: Central Nervous System (CNS) only disease'
- 'Exclude - 16. Treatment Arm I: Patients within 28 days of any CAR-T cell therapy
  or other cellular therapies'
- 'Exclude - 17. Treatment Arm I: Patients within 90 days of receiving craniospinal
  irradiation'
- 'Exclude - 18. Treatment Arm I: Left ventricular shortening fraction (LVSF) <27%
  or left ventricular ejection fraction (LVEF) <50%, as determined by ECHO or MUGA,
  any evidence of pericardial effusion (except trace or physiological) as determined
  by an ECHO, and any clinically significant arrhythmias'
- 'Exclude - 19. Treatment Arm I: Known CD20 negative disease at initial diagnosis'
- Exclude - 2. Patients with post-transplant lymphoproliferative disorder (PTLD)
- 'Exclude - 20. Treatment Arm I: Seizure within the last 12 months'
- 'Exclude - 21. Treatment Arm I: Prior treatment with CD20 x CD3 bispecific therapy'
- 'Exclude - 22. Treatment Arm I: Known hypersensitivity to both allopurinol and rasburicase'
- 'Exclude - 23. Treatment Arm II: Patients aged <6 months old at the time of trial
  entry'
- 'Exclude - 24. Treatment Arm II: Patients within 42 days of any CAR-T cell therapy
  or other cellular therapies'
- "Exclude - 25. Treatment Arm II: Clinically significant (Grade \u22652) third space\
  \ fluid accumulation (i.e. ascites requiring drainage or pleural effusion that is\
  \ either requiring drainage or associated with shortness of breath)"
- 'Exclude - 26. Treatment Arm II: Steroid treatment for more than a total of seven
  days in the 14 days prior to trial entry'
- 'Exclude - 27. Treatment Arm II: Severe heart failure (New York Heart Association
  Class IV) or severe, uncontrolled cardiac disease'
- Exclude - 3. Patients with primary CNS lymphoma
- 'Exclude - 4. Patients within: o 90 days after an allogenic HSCT procedure o 45
  days after an autologous HSCT procedure o Patients within 28 days of systemic therapy
  and/or immunosuppressive treatment for Graft versus Host Disease (GvHD) o 14 days
  of previous investigational treatment o 28 days of receiving craniospinal radiation,
  unless otherwise specified in the treatment arm specific eligibility criteria; or
  14 days of any other radiation'
- "Exclude - 5. Patients who have ongoing acute toxicities from most recent lymphoma\
  \ directed therapy (any toxicity \u2265 grade 3 not otherwise defined in the exclusion\
  \ criteria)"
- Exclude - 6. Patients who have received any cytoreductive or other chemotherapy
  in the last 7 days prior to trial entry
- Exclude - 7. Patients with known DNA repair disorder or known primary immunodeficiency
- Exclude - 8. Patients who are pregnant or breastfeeding (exclusively or partially)
- Exclude - 9. Patients for whom non-compliance with treatment, trial procedures,
  or protocol follow up schedule is expected and all available resources to facilitate
  inclusion have been exhausted
