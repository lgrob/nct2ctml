summary: 'The primary objectives for this trial are related to each of the trial questions.


  For the chemotherapy questions, the objectives are to determine:

  • Whether outcome in newly diagnosed metastatic ES patients can be improved with the addition of regorafenib
  to the standard backbone chemotherapy VDC/IE when compared with VDC/IE alone (Randomisation A)

  • Whether the addition of 6 cycles of maintenance chemotherapy of vinorelbine and cyclophosphamide improves
  the outcome for patients. (Randomisation C)


  For the radiotherapy questions, the objectives are to determine:

  • Whether dose escalation of radiotherapy improves the outcome in patients with inoperable disease (Randomisation
  B1)

  • Which of the two post-operative radiotherapy doses following surgical resection of the primary tumour
  site will result in achieving optimal outcome (Randomisation B2)'
