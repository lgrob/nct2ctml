summary: "1.\tTo estimate the 3-year event free survival (EFS) of children, adolescents, and young adults\
  \ with newly-diagnosed Ph+ (BCR::ABL1-rearranged) B-ALL who are treated with a modified Berlin-Frankfurt-Münster\
  \ (mBFM) chemotherapy backbone that incorporates three cycles of blinatumomab without traditional consolidation\
  \ chemotherapy in combination with continuous dasatinib.\n2.\tTo estimate the 3-year EFS of children,\
  \ adolescents, and young adults with newly-diagnosed ABL-class Ph-like B-ALL who are treated with a\
  \ modified BFM chemotherapy backbone that incorporates three cycles of blinatumomab without traditional\
  \ consolidation chemotherapy in combination with continuous imatinib for those with PDGFRB gene fusions\
  \ or dasatinib for those without PDGFRB gene fusions\n3.\tTo describe the safety and toxicity profile\
  \ (infections, mucositis, neurotoxicity, cytokine release syndrome, hypogammaglobulinemi"
prior_treatment_requirements:
- Patients must be >365 days and <18 years (for AIEOP-BFM), >365 days and <22 years (for COG) and >365
  days and <46 years (for ALLTogether sites) at the time of enrollment.
- Adequate liver function
- Adequate cardiac function
- 'Newly-diagnosed Ph+ or ABL-class Ph-like B-ALL. Leukemic blasts must express CD19. ABL-class fusions
  are defined as rearrangements involving the following genes predicted to be sensitive to imatinib and/or
  dasatinib: ABL1, ABL2, CSF1R, and PDGFRB.'
- Evidence of BCR::ABL1 should be documented by a clinically-validated assay prior to study entry on Day
  15 from the first dose of vincristine during Induction therapy.
- Patients with Ph+ B-ALL must have previously started Induction therapy, which includes vincristine,
  a corticosteroid, pegaspargase or calaspargase pegol, with or without anthracycline, and/or other standard
  cytotoxic chemotherapy.
- Patients with Ph+ B-ALL have not received more than 14 days of systemic Induction therapy beginning
  with the first Induction dose of vincristine.
- Patients with ABL-class Ph-like B-ALL must have previously completed 4 or 5 weeks of multiagent Induction
  chemotherapy
- Patients may have started either imatinib or dasatinib prior to study entry but should have received
  no more than 14 days of TKI for Ph+ B-ALL or no more than 35 days of TKI for ABL-class Ph-like B-ALL.
- Patients must have a performance status corresponding to ECOG scores of ≤2 or Karnofsky and Lansky performance
  scores ≥50%. Use Karnofsky for patients >16 years of age and Lansky for patients ≤ 16 years of age.
- Adequate renal function
