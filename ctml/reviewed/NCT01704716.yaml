summary: 'This is a randomized study of the European SIOP Neuroblastoma Group (SIOPEN) in high-risk neuroblastoma
  (stages 2, 3, 4 and 4s MYCN-amplified neuroblastoma, stage 4 MYCN non amplified \> 12 months at diagnosis).


  The protocol consists of a rapid, dose intensive induction chemotherapy, peripheral blood stem cell
  harvest, attempted complete excision of the primary tumour, myeloablative therapy followed by peripheral
  blood stem cell rescue, radiotherapy to the site of the primary tumour and immunotherapy (R4 randomization
  - isotretinoin and ch14.18/CHO (Dinutuximab beta, Qarziba ®).), with or without s.c. aldesleukin (IL-2)).
  Patients diagnosed after the closure of R3 randomization will not be R4 randomized. For these patients
  the use of ch14.18/CHO antibody is recommended without scIL-2 as continuous infusion as standard of
  care outside of controlled trials. ch14.18/CHO received marketing '
treatment_list:
  step:
  - step_internal_id: 1
    step_code: '1'
    step_type: Registration
    match:
    - and:
      - or:
        - and:
          - clinical:
              oncotree_primary_diagnosis: Neuroblastoma
          - genomic:
              hugo_symbol: MYCN
              variant_category: Copy Number Variation
              cnv_call: High Amplification
        - and:
          - clinical:
              oncotree_primary_diagnosis: Neuroblastoma
              age_numerical: '>=1'
          - genomic:
              hugo_symbol: MYCN
              variant_category: Copy Number Variation
              cnv_call: '!High Amplification'
      - clinical:
          age_numerical: <21
    arm:
    - arm_code: 'R0: COJEC plus G-CSF'
      arm_internal_id: 0
      arm_description: Patients randomised to G-CSF during induction treatment (Rapid COJEC) received
        a single daily subcutaneous injection of 5 microgram/kg/day G-CSF (filgrastim) beginning 24 hours
        after the last chemotherapy dose.
      arm_suspended: N
      dose_level: []
    - arm_code: 'R0: COJEC'
      arm_internal_id: 1
      arm_description: Induction treatment (COJEC) without filgrastim Patients randomised to Rapid COJEC
        alone will receive induction Treatment without G-CSF
      arm_suspended: N
      dose_level: []
    - arm_code: 'R1: BuMel MAT'
      arm_internal_id: 2
      arm_description: 'The BuMel MAT regimen consists of oral administration of busulphan and the short
        i.v. infusion of melphalan.


        In July 2007 (amendment 3) oral busulfan was changed to i.v. Busulfan (Busilvex)'
      arm_suspended: N
      dose_level: []
    - arm_code: 'R1: CEM MAT'
      arm_internal_id: 3
      arm_description: 'The CEM MAT regimen uses three drugs: the dose of Carboplatin must be based on
        renal function with a target area under the concentration versus time curve (AUC) of 16.4 mg/ml.min,
        etoposide 350 mg/m2/course and melphalan 210 mg/m2/course'
      arm_suspended: N
      dose_level: []
    - arm_code: 'R2: ch14.18/CHO'
      arm_internal_id: 4
      arm_description: ch14.18/CHO is given at a dose of 20 mg/m2/day over five days every four weeks
        for five courses
      arm_suspended: N
      dose_level: []
    - arm_code: 'R2: ch14.18/CHO plus Aldesleukin'
      arm_internal_id: 5
      arm_description: Patients randomised to receive ch14.18/CHO plus Aldesleukin
      arm_suspended: N
      dose_level: []
    - arm_code: 'R3: COJEC Induction'
      arm_internal_id: 6
      arm_description: 'Rapid COJEC induction treatment is applied over ten weeks; three different courses
        are given every ten days:


        Course A (given on days 0 and 40): vincristine, carboplatin, and etoposide Course B (given on
        days 10, 30, 50, and 70): vincristine and cisplatin Course C (given on days 20 and 60): vincristine,
        etoposide, and cyclophosphamide'
      arm_suspended: N
      dose_level: []
    - arm_code: 'R3: Modified N7'
      arm_internal_id: 7
      arm_description: 'The modified N7 induction is a dose intense induction chemotherapy regimen including
        two putatively non cross-resistent drug combinations: high-dose cyclophosphamide plus doxorubicin/vincristine
        (CAV) and high-dose cisplatin/etoposide (P/E).'
      arm_suspended: N
      dose_level: []
    - arm_code: 'R4: cnt inf ch14.18/CHO'
      arm_internal_id: 8
      arm_description: ch14.18/CHO is given as continuous Infusion over 10 days at a cumulative dose of
        100mg/m2. Patients receive 5 cycles of ch14.18/CHO
      arm_suspended: N
      dose_level: []
    - arm_code: 'R4: cnt inf ch14.18/CHO plus Aldesleukin'
      arm_internal_id: 9
      arm_description: 'ch14.18/CHO is given as continuous Infusion over 10 days at a cumulative dose
        of 100mg/m2. Patients receive 5 cycles of ch14.18/CHO.


        In addition, Aldesleukin is given at a dose of 3 x 10e6 on days 1 to 5 and on days 9, 11, 13,
        15, and 17 during ch14.18/CHO infusion'
      arm_suspended: N
      dose_level: []
