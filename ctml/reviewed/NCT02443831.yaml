summary: This study aims to evaluate the safety, efficacy and duration of response
  of CD19+CD22 Chimeric Antigen Receptor (CAR) redirected autologous T-cells in children
  with high risk, relapsed CD19+ and CD22+ acute lymphoblastic leukaemia
