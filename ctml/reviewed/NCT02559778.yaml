status: open to accrual
summary: A prospective open label, multicenter study to evaluate the feasibility and
  acute toxicity of using molecularly guided therapy in combination with standard
  therapy followed by a Randomized Controlled Trial of standard immunotherapy with
  or without DFMO followed by DFMO maintenance for Newly Diagnosed High-Risk Neuroblastoma.
