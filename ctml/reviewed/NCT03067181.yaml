status: open to accrual
summary: This phase III trial studies how well active surveillance help doctors to
  monitor subjects with low risk germ cell tumors for recurrence after their tumor
  is removed. When the germ cell tumor has spread outside of the organ in which it
  developed, it is considered metastatic. Chemotherapy drugs, such as bleomycin, carboplatin,
  etoposide, and cisplatin, work in different ways to stop the growth of tumor cells,
  either by killing the cells, by stopping them from dividing, or by stopping them
  from spreading. The trial studies whether carboplatin or cisplatin is the preferred
  chemotherapy to use in treating metastatic standard risk germ cell tumors.
