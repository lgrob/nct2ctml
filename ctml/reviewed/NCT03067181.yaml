      arm_internal_id: 0
      arm_description: Patients receive bleomycin IV over 10 minutes and carboplatin
        IV over 1 hour on day 1. Patients also receive etoposide IV over 1-2 hours
        on days 1-5. Treatment repeats every 21 days for up to 4 cycles in the absence
        of disease progression or unacceptable toxicity. Patients undergo CT, MRI,
        and/or chest x-ray as well as blood sample collection throughout the trial.
        Patients may also undergo a tumor biopsy throughout the trial. Patients undergo
        a pulmonary function test on study.
