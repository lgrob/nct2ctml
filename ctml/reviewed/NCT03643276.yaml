summary: 'The understanding of acute lymphoblastic leukemia (ALL) in childhood and adolescence has largely
  changed due to extensive genetic research in recent years: ALL is now considered to be a very heterogeneous
  disease group. The leukemia cells present themselves with quite differently activated regulatory mechanisms
  of the malignant phenotype. The introduction of more accurate methods of assessing therapy response
  ("minimal residual disease \[MRD\] tests") has provided new insights into very different mechanisms
  of action, including factors influenced by host factors; this has had practical clinical consequences
  for the use of more individualized therapy. Multimodal therapies have enabled a cure level of over 80%
  for ALL in this age group. However, the own and international study data show that the therapy toxicity
  of the contemporary chemotherapy concepts has become unacceptably high, in par'
