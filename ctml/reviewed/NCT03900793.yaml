prior_treatment_requirements:
- 'Inclusion Criteria:'
- '* 1\. Provision to sign and date the consent form (if individual is a minor, provision
  of a parent or legal guardian to sign and date the consent form and provision of
  individual to provide assent for study).'
- 2\. Stated willingness to comply with all study procedures and be available for
  the duration of the study.
- "3\\. Male or female aged \u2265 10 years old. 4. Histologically confirmed osteosarcoma\
  \ (at either original diagnosis or relapse) that has either recurred or progressed\
  \ after at least one prior systemic therapy and for which no curative therapy exists."
- '* Patients with surface or periosteal osteosarcoma are not eligible.'
- '* Patients with active CNS metastasis are not eligible. Previously treated CNS
  metastases which occurred 3 months or more prior, without evidence of active recurrence,
  are acceptable.'
- 5\. Disease status
- '* Dose Escalation (Part A): Patients must have measurable or evaluable disease.'
- '* Cohort Expansion (Part B): Patients with measurable or evaluable disease and
  those with completely resected disease are eligible.'
- '6\. Performance status:'
- "* Performance status ECOG performance status (\\>18 years old) \u2264 2 or Karnofsky\
  \ performance score (\\<18 years old) \\> 50 7. Prior Therapy:"
- '* Patients must have fully recovered from the acute toxic effects of all prior
  anti-cancer therapy and must meet the following minimum duration from prior anti-cancer
  directed therapy prior to enrollment. If after the required timeframe, the numerical
  eligibility criteria are met (e.g., blood count criteria) the patient is considered
  to have recovered adequately.'
- 1. Cytotoxic chemotherapy or other anti-cancer agents known to be myelosuppressive.
  At least 21 days after the last dose of cytotoxic or myelosuppressive chemotherapy
  (42 days if prior nitrosourea).
- "2. Anti-cancer agents not known to be myelosuppressive (e.g., not associated with\
  \ reduced platelet or ANC counts): \u2265 7 days after the last dose of agent."
- "i. Antibodies: \u2265 21 days must have elapsed from infusion of last dose of antibody,\
  \ and toxicity related to prior antibody therapy must be recovered to Grade \u2264\
  \ 1."
- "ii. Corticosteroids: \u2265 14 days must have elapsed since last dose of corticosteroid."
- "iii. Hematopoietic growth factors: \u2265 14 days after the last dose of a long-\
  \ acting growth factor (e.g., pegfilgrastim) or 7 days for short-acting growth factor."
- "iv. Interleukins, Interferons and Cytokines (other than hematopoietic growth factors):\
  \ \u2265 21 days after the completion of interleukins, interferon or cytokines (other\
  \ than Hematopoietic Growth Factors)."
- "v. Stem cell Infusions: Autologous stem cell infusion, including boost infusion:\
  \ \u2265 42 days."
- "vi. Cellular Therapy: \u2265 42 days after the completion of any type of cellular\
  \ therapy (e.g., modified T cells, NK cells, dendritic cells, etc.) vii. XRT/External\
  \ Beam Irradiation including protons: \u2265 14 days after local XRT; \u2265 150\
  \ days after TBI, craniospinal XRT or if radiation to \u2265 50% of the pelvis;\
  \ \u2265 42 days if other substantial bone marrow radiation."
- '* NOTE: Patients with history of cardiac irradiation with mean cardiac dose \>
  15 Gy are not eligible (see exclusion criteria).'
- '8\. Adequate bone marrow function, defined as:'
- "* Peripheral absolute neutrophil count (ANC) \u2265 750/mm3"
- "* Platelet count \u2265 75,000/mm3 (transfusion independent, defined as not receiving\
  \ platelet transfusions for at least 7 days prior to enrollment)."
- "* Hemoglobin \u2265 8 g/dL (with or without transfusion) 9. Adequate renal function,\
  \ defined as:"
- '* Creatinine clearance or radioisotope GFR \> 70 mL/min/1.73 m2 OR a serum creatinine
  based on age/gender.'
- '10\. Adequate hepatic function, defined as:'
- "* Total bilirubin \u2264 1.5 x upper limit of normal (ULN) for age"
- "* SGPT (ALT) \u2264 135 U/L. For the purpose of this study, the ULN for SGPT is\
  \ 45 U/L."
- "* Serum albumin \u2265 2.8 g/dL 11. Patients with \u2265 trace protein on urinalysis\
  \ at screening will be allowed to enroll in the study at investigator discretion.\
  \ A baseline urine protein creatinine ratio (UPC) should be obtained for patients\
  \ with \u2265 trace protein on urinalysis for consideration regarding Section 6.3.7\
  \ dose modification requirements."
- '12\. Adequate cardiac function, defined as:'
- '* Current cardiac ejection fraction \> 50% by biplane Simpson method on echocardiogram'
- "* QTc \u2264 480 ms 13. Patients with preexisting hyper- or hypothyroidism must\
  \ be on a stable dose of medication."
- '14\. Ability to take and retain oral medications. NOTE: Medication can be administered
  via nasogastric or gastrostomy tube.'
- 'Exclude - Exclusion Criteria:'
- Exclude - 1. Patients who underwent major surgery within 14 days prior to start
  of treatment are not eligible.
- 'Exclude - NOTE: Core biopsy or central line placement are considered minor and
  are allowed within any time limitations.'
- Exclude - 2. Patients with uncontrolled coagulopathy or bleeding disorder, or any
  active bleeding (i.e., gastrointestinal or pulmonary) deemed to be clinically significant
  by investigator are not eligible.
- Exclude - 3. Patients with history of pulmonary embolism or significant thromboembolic
  event with the preceding 28 days. Patients with thromboembolic events \> 28 days
  before enrollment who are stable on or completed an anticoagulation course are eligible.
- Exclude - 4. Patients with history of cardiac irradiation with mean cardiac dose
  \> 15 Gy are not eligible.
- Exclude - 5. Patients with symptomatic cardiac disease (i.e. New York Heart Association
  or Modified Ross Heart Failure Classification for Children \> class 2) are not eligible.
- Exclude - 6. Patients with any history of cardiac dysfunction including prior abnormal
  echocardiogram (ejection fraction \< 50%), severe or unstable angina, peripheral
  vascular disease, congenital prolonged QTc syndrome, clinically significant cardiac
  arrhythmias, stroke, or myocardial infarction are not eligible.
- Exclude - 7. Pregnancy
- Exclude - * Pregnant or breast-feeding women will not be entered on this study because
  there is not yet available information regarding human fetal or teratogenic toxicities.
  Pregnancy tests must be obtained in females who are post-menarchal.
- 'Exclude - * Males or females of reproductive potential may not participate unless
  they have agreed to practice 1 highly effective and 1 additional effective (barrier)
  method of contraception at the same time during the entire study treatment period
  and through 3 months after the last dose of study drug, or agree to practice true
  abstinence, when this is in line with the preferred and usual lifestyle of the subject.
  Patients who themselves or their partners have undergone female or male sterilization
  do not require 2 methods of contraception. Highly effective methods are defined
  as those with \<1% failure rate with perfect use and include: oral contraceptive
  pills (combined or progesterone only), intrauterine devices (IUD), hormonal implant
  or injection, contraceptive patch, and vaginal ring.'
- 'Exclude - 8. Concomitant medications:'
- 'Exclude - * Anti-hypertensives: Patients who cannot be controlled to goal blood
  pressure for gender/age are not eligible.'
- 'Exclude - * Corticosteroids: Patients receiving systemic corticosteroids are not
  eligible. \> 14 days must have elapsed since last systemic corticosteroid. Note:
  patients using topical or inhaled corticosteroids are eligible.'
- 'Exclude - * Investigational Drugs: Patients currently receiving another investigational
  drug are not eligible.'
- 'Exclude - * Anti-cancer agents: Patients currently receiving other anti-cancer
  agents are not eligible.'
- 'Exclude - * Drug interactions: Patients who require treatment with medications
  that are strong inhibitors or inducers of CYP3A4 or inhibitors of CYP2A9 or have
  received these medications in the 7 days prior to enrollment, are not eligible.
  Patients who require treatment with enzyme inducing anticonvulsants are not eligible.'
- 'Exclude - * Medications that prolong QTc: Patients who require treatment with medications
  known to prolong QTc are not eligible'
