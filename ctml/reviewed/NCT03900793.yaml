status: open to accrual
summary: This study is a Phase 1/1b clinical trial that aims to determine the Maximally
  Tolerated Dose of Losartan and Sunitinib Combination Therapy. Patients will first
  be accrued to the Dose Escalation phase of the study, using a 3+3 design. Medication
  dosages will increase until a maximally tolerated dose is found. Patients will then
  be accrued to the Dose Expansion phase of the trial, where efficacy of pre-determined
  dose will be preliminarily assessed.
treatment_list:
  step:
  - step_internal_id: 111
    step_code: '1'
    step_type: Registration
    arm:
    - arm_code: Dose Escalation and Expansion
      arm_internal_id: 0
      arm_description: Participants receive losartan in combination with sunitinib
        in 42-day treatment cycles. During Part A, participants are enrolled using
        a standard 3+3 dose-escalation design across up to four dose levels. Dose
        Levels 1 and 2 utilized once-daily losartan dosing and are closed to enrollment.
        Active enrollment occurs at Dose Levels 3 and 4, where losartan is administered
        twice daily and sunitinib is administered daily for 4 weeks followed by a
        2-week rest period. Following determination of the maximally tolerated dose
        (MTD), 12 additional participants are enrolled into an expansion cohort to
        further evaluate safety, pharmacokinetics, pharmacodynamics, and preliminary
        antitumor activity.
      arm_suspended: N
      dose_level:
      - level_code: '0'
        level_description: 'Drug: Losartan'
        level_internal_id: 0
        level_suspended: N
      - level_code: '1'
        level_description: 'Drug: Sunitinib'
        level_internal_id: 1
        level_suspended: N
