prior_treatment_requirements:
- 'Inclusion Criteria:'
- "1. Age \u2265 1 and \u2264 26 years"
- 2. Diagnosis of refractory or recurrent CNS disease for which there is no standard
  therapy, or diagnosis of DIPG or DMG at any time point following completion of standard
  therapy
- 3. Able to tolerate apheresis, or has apheresis product available for use in manufacturing
- 4. CNS reservoir catheter, such as an Ommaya or Rickham catheter
- "5. Life expectancy \u2265 8 weeks"
- "6. Lansky or Karnofsky score \u2265 60"
- '7. If patient does not have previously obtained apheresis product, patient must
  have discontinued, and recovered from acute toxic effects of, all prior chemotherapy,
  immunotherapy, and radiotherapy and discontinue the following prior to enrollment:'
- "1. \u2265 7 days post last chemotherapy/biologic therapy administration"
- 2. 3 half lives or 30 days, whichever is shorter post last dose of anti-tumor antibody
  therapy
- 3. Must be at least 30 days from most recent cellular infusion
- 4. All systemically administered corticosteroid treatment therapy must be stable
  or decreasing within 1 week prior to enrollment with maximum dexamethasone dose
  of 2.5 mg/m2/day. Corticosteroid physiologic replacement therapy is allowed.
- 8. Adequate organ function
- 9. Adequate laboratory values
- 10. Patients of childbearing/fathering potential must agree to use highly effective
  contraception
- 'Exclude - Exclusion Criteria:'
- "Exclude - 1. Presence of Grade \u2265 3 cardiac dysfunction or symptomatic arrhythmia\
  \ requiring intervention"
- Exclude - 2. Presence of primary immunodeficiency/bone marrow failure syndrome
- Exclude - 3. Presence of clinical and/or radiographic evidence of impending herniation
- Exclude - 4. Presence of \>Grade 3 dysphagia
- Exclude - 5. Presence of active malignancy other than the primary CNS tumor under
  study
- Exclude - 6. Presence of active severe infection
- Exclude - 7. Receiving any anti-cancer agents or chemotherapy
- Exclude - 8. Pregnant or breastfeeding
- Exclude - 9. Subject and/or authorized legal representative unwilling or unable
  to provide consent/assent for participation in the 15 year follow up period
- Exclude - 10. Presence of any condition that, in the opinion of the investigator,
  would prohibit the patient from undergoing treatment under this protocol
