summary: International multicenter, open-label, randomized phase III trial with three sequential randomizations
  assessing induction, high-dose consolidation and radiotherapy in high-risk neuroblastoma.
prior_treatment_requirements:
- No previous chemotherapy, or up to 21 days after one cycle of Carboplatin-Etoposide.
- High-risk neuroblastoma per SIOPEN-modified INRG criteria.
