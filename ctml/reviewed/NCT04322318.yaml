    - arm_code: Arm II (Regimen ICE/Cyclo/Topo)
      arm_internal_id: 1
      arm_description: 'CYCLES 1, 2, 4, 5, 7, AND 9: Patients receive carboplatin
        IV over 15-60 minutes on day 1. Patients also receive etoposide IV over 1-2
        hours and ifosfamide IV over 2-4 hours on days 1-3. Treatment repeats every
        21 days during cycles 1, 2, 4, 5, 7, and 9 in the absence of disease progression
        or unacceptable toxicity.


        CYCLES 3, 6, 8, AND 10: Patients receive cyclophosphamide IV over 15-30 minutes
        and topotecan IV over 30 minutes on days 1-5. Treatment repeats every 21 days
        during cycles 3, 6, 8, and 10 in the absence of disease progression or unacceptable
        toxicity.


        Patients undergo surgery and/or RT during cycles 4, 7, and 10 as clinically
        indicated. Patients undergo a CT scan, a PET scan, a chest x-ray, MRI, an
        abdominal ultrasound, and/or a bone scan throughout the trial. Patients may
        also undergo blood specimen collection and biopsy throughout the trial.'
