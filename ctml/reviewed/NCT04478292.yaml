prior_treatment_requirements:
- 'Inclusion Criteria:'
- "* Performance Level Patients must have a performance status corresponding to ECOG\
  \ scores 0, 1, or 2. Use Karnofsky for patients \\>16 years of age and Lansky for\
  \ patients \u226416 years of age."
- '* Diagnosis Patients must be newly diagnosed with histologically-proven primary
  pediatric HB'
- '* Emergent Treatment for HB In emergency situation when a patient meets all other
  eligibility criteria and has had baseline required observations, but is too ill
  to undergo a biopsy safely, the patient may be enrolled without a biopsy.'
- '* Prior Therapy Patients may have had surgical resection of the hepatic malignancy
  prior to enrollment. All other anti-cancer therapy for the current liver lesion
  is prohibited.'
- '* Organ Function Requirements'
- 'I) Adequate renal function defined as:'
- "Creatinine clearance or radioisotope Glomerular Filtration Rate (GFR) \u2265 70\
  \ mL/min/1.73 m2"
- 'II) Adequate liver function defined as:'
- "Total bilirubin \u2264 5 x upper limit of normal (ULN) for age, and Aspartate aminotransferase\
  \ (AST) or Alanine transaminase (ALT) \\< 10 x upper limit of normal (ULN) for age."
- 'III) Adequate pulmonary function defined as:'
- Normal pulmonary function tests (including DLCO) if there is clinical indication
  for determination (e.g. dyspnea at rest, known requirement for supplemental oxygen)
- 'Exclude - Exclusion Criteria:'
- Exclude - * Prior chemotherapy or tumor directed therapy expect for surgical resection
  of the hepatic malignancy (i.e. radiation therapy, biologic agents, local therapy
  (embolization, radiofrequency ablation, and laser)). Therefore, patients with a
  pre-disposition syndrome who have a prior malignancy are not eligible.
- Exclude - * Patients who are currently receiving another investigational drug.
- Exclude - * Patients who are currently receiving other anticancer agents.
- Exclude - * Patients with uncontrolled infection.
- Exclude - * Patients who previously received a solid organ transplant.
