  step:
  - step_internal_id: 111
    step_code: '1'
    step_type: Registration
    arm:
    - arm_code: Group A
      arm_internal_id: 0
      arm_description: "* Group A1\uFF1A tumor is completely resected at diagnosis\
        \ and receives no adjuvant chemotherapy\uFF08well differentiated fetal \\\
        [WDF\\] histology HB) \uFF1B\n* Group A2\uFF1Atumor is completely resected\
        \ followed by 2 cycles of standard dose cisplatin monotherapy \uFF08non-well\
        \ differentiated fetal histology HB)"
      arm_suspended: N
      dose_level:
      - level_code: '0'
        level_description: 'Procedure: Primary surgery resection'
        level_internal_id: 0
        level_suspended: N
      - level_code: '1'
        level_description: 'Drug: mono CDDP-Group A2'
        level_internal_id: 1
        level_suspended: N
    - arm_code: Group B
      arm_internal_id: 1
      arm_description: '* Patients will be randomized to one of 2 arms: Arm CDDP or
        Arm CDDP plus STS. In each arm, patients will be stratified by resectablity
        after completion of 2 cycles of protocol therapy (6 cycles of standard dose
        cisplatin monotherapy with or without STS). All the patients in 2 arms will
        receive 6 cycles chemotherapy in total.

        * Resection of the primary tumor will be performed after completing the 2nd
        cycle of chemotherapy.

        * Those patients whose tumors after 2 cycles do not meet criteria for definitive
        surgical, 2nd resectablity evaluation will be scheduled after 4 cycles of
        chemotherapy.'
      arm_suspended: N
      dose_level:
      - level_code: '0'
        level_description: 'Drug: Sodium Thiosulfate Injection'
        level_internal_id: 0
        level_suspended: N
      - level_code: '1'
        level_description: 'Procedure: Biopsy'
        level_internal_id: 1
        level_suspended: N
      - level_code: '2'
        level_description: 'Procedure: Resection or transplant'
        level_internal_id: 2
        level_suspended: N
      - level_code: '3'
        level_description: 'Drug: mono CDDP- Group B'
        level_internal_id: 3
        level_suspended: N
    - arm_code: Group C
      arm_internal_id: 2
      arm_description: '* Patients in Group C will have locally advanced tumors including
        PRETEXT I-III tumors with a positive VPEFR annotation factor and all PRETEXT
        IV tumors.

        * Patients will be randomized to one of 2 arms: Arm C5VD or Arm C5VD plus
        STS. In each arm, patients will be stratified by resectablity after completion
        of 2 cycles of protocol therapy. All the patients in 2 arms will receive 6
        cycles chemotherapy in total.

        * Resection of the primary tumor will be performed after completing the 2nd
        cycle of chemotherapy.

        * Those patients whose tumors after 2 cycles do not meet criteria for definitive
        surgical, 2nd resectablity evaluation will be scheduled after 4 cycles of
        chemotherapy.'
      arm_suspended: N
      dose_level:
      - level_code: '0'
        level_description: 'Drug: Sodium Thiosulfate Injection'
        level_internal_id: 0
        level_suspended: N
