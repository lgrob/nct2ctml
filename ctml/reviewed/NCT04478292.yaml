summary: A Phase 3 multi-institutional study for treatment of children with newly
  diagnosed hepatoblastoma using a modified Paediatric Hepatic International Tumour
  Trial (PHITT) strategy incorporating a randomized assessment of sodium thiosulfate
  as auditory protection for children with localized disease, and response adapted
  therapy for patients with metastatic disease
