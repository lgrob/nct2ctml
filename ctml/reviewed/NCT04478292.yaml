        level_description: 'Drug: Cisplatin, 5-Fluorouracil, Vincristine, Doxorubicin-Group
          C'
        level_internal_id: 1
        level_suspended: N
      - level_code: '2'
        level_description: 'Procedure: Biopsy'
        level_internal_id: 2
        level_suspended: N
      - level_code: '3'
        level_description: 'Procedure: Resection or transplant'
        level_internal_id: 3
        level_suspended: N
    - arm_code: Group D
      arm_internal_id: 3
      arm_description: "* These patients have metastatic disease, suspected HB patients\
        \ \u2265 8 years of age, or have an AFP \u2264 100 at diagnosis.\n* Patients\
        \ will receive initial chemotherapy according to the cisplatin-intensive SIOPEL-4\
        \ induction regimen. Resection (including transplant) of the primary tumor\
        \ should be completed after induction Block 3, but primary tumor resection\
        \ can be planned any time after completing induction therapy.\n* Following\
        \ 3 blocks of induction chemotherapy, patients will be stratified into 2 risk\
        \ groups: Group D1 includes patients who either have a chemotherapy-induced\
        \ lung CR or are rendered a lung CR by surgical metastasectomy. These patients\
        \ will have chemotherapy consolidation with carboplatin/doxorubicin. In Group\
        \ D2, patients will have not yet achieved a lung CR at the end of induction\
        \ Block 3. These patients will get intensified consolidation therapy of carboplatin/doxorubicin\
        \ with vincristine/irinotecan.\n* Resection of pulmonary nodules should be\
        \ considered in Group D2."
      arm_suspended: N
      dose_level:
