status: open to accrual
summary: 'This is a pilot study that will evaluate disease status in children that
  have been newly diagnosed high-grade glioma with TRK fusion. The evaluation will
  occur after 2 cycles of the medication (Larotrectinib) have been given.


  The study will also evaluate the safety of larotrectinib when given with chemotherapy
  in your children; as well as the safety larotrectinib when given post-focal radiation
  therapy.'
