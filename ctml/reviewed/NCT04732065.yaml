summary: This phase I trial studies the effects and best dose of ONC206 alone or in combination with radiation
  therapy in treating patients with diffuse midline gliomas that is newly diagnosed or has come back (recurrent)
  or other recurrent primary malignant CNS tumors. ONC206 is a recently discovered compound that may stop
  cancer cells from growing. This drug has been shown in laboratory experiments to kill brain tumor cells
  by causing a so called "stress response" in tumor cells. This stress response causes cancer cells to
  die, but without affecting normal cells. ONC206 alone or in combination with radiation therapy may be
  effective in treating newly diagnosed or recurrent diffuse midline gliomas and other recurrent primary
  malignant CNS tumors.
treatment_list:
  step:
  - step_internal_id: 1
    step_code: '1'
    step_type: Registration
    match:
    - and:
      - or:
        - clinical:
            oncotree_primary_diagnosis: Diffuse Midline Glioma, H3 K27-Altered
        - clinical:
            oncotree_primary_diagnosis: Ependymoma
        - clinical:
            oncotree_primary_diagnosis: High-Grade Glioma, NOS
        - clinical:
            oncotree_primary_diagnosis: Medulloblastoma
      - clinical:
          age_numerical: '>=2'
      - clinical:
          age_numerical: <=22
    arm:
    - arm_code: 'Arm A: ONC206 for participants with diffuse midline gliomas + prior therapy'
      arm_internal_id: 0
      arm_description: Participants receive ONC206 orally (PO) up to six times per week. Cycles repeat
        every 28 days for up to 12 months in the absence of disease progression or unacceptable toxicity.
        In case the participant receives clinical benefit from the treatment, treatment can proceed up
        to 24 months.
      arm_suspended: N
      dose_level: []
    - arm_code: 'Arm B: ONC206 + radiation therapy for newly diagnosed participants'
      arm_internal_id: 1
      arm_description: Participants undergo standard of care radiation therapy daily 5 days a week and
        receive ONC206 PO up to six times per week. Cycles repeat every 28 days for up to 12 months in
        the absence of disease progression or unacceptable toxicity. In case the participant receives
        clinical benefit from the treatment, treatment can proceed up to 24 months.
      arm_suspended: N
      dose_level: []
    - arm_code: 'Arm C: ONC206 + radiation therapy, DMGs with evidence of first progression but previously
        untreated'
      arm_internal_id: 2
      arm_description: Participants undergo standard of care radiation therapy daily 5 days a week and
        receive ONC206 PO up to six times per week. Cycles repeat every 28 days for up to 12 months in
        the absence of disease progression or unacceptable toxicity. In case the participant receives
        clinical benefit from the treatment, treatment can proceed up to 24 months.
      arm_suspended: N
      dose_level: []
    - arm_code: 'Arm D: ONC206 Therapy, Primary malignant CNS tumors with progression'
      arm_internal_id: 3
      arm_description: Participants receive ONC206 PO once a day (QD) up to six times per week. Cycles
        repeat every 28 days for up to 12 months in the absence of disease progression or unacceptable
        toxicity. In case the participant receives clinical benefit from the treatment, treatment can
        proceed up to 24 months.
      arm_suspended: N
      dose_level: []
