summary: 'This phase II trial determines if the combination of ONC201 with different drugs is effective
  for treating participants with diffuse midline gliomas (DMGs). Despite years of research, little to
  no progress has been made to improve outcomes for participants with DMGs, and there are few treatment
  options. This trial will utilize an adaptive platform design in that the different treatment arms for
  each cohort will be opened and closed based on ongoing preclinical investigation as well as evolving
  outcome data from the trial.


  Novel agents will be continuously added to this study as pre-clinical data emerge to suggest additive
  or synergistic activity when combined ONC201. Should a novel agent not have an RP2D at the time of incorporation
  into this study, a phase 1 lead-in will be performed prior to initiation of combination therapy (via
  study amendment).'
