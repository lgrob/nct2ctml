- Exclude - * This virus infects cells with a deficit in the RB gene. Therefore, participants
  with Li-Fraumeni Syndrome or a known germ line deficit in the retinoblastoma gene
  or its related pathway are excluded.
- Exclude - * Participants must not have live or live-attenuated vaccinations within
