summary: A study to evaluate if the randomized addition of venetoclax to a chemotherapy backbone (fludarabine/cytarabine/gemtuzumab
  ozogamicin \[GO\]) improves survival of children/adolescents/young adults with acute myeloid leukemia
  (AML) in 1st relapse who are unable to receive additional anthracyclines, or in 2nd relapse.
