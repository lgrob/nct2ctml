    - arm_code: 'Arm B: Experimental Arm with Venetoclax'
      arm_internal_id: 1
      arm_description: 'During Cycle 1 (42-day-cycles), participants will receive 300 mg adult dose equivalent
        of venetoclax once on Day 1 followed by 600 mg adult dose equivalent of venetoclax on Days 2-21.
        Participants will also receive 30 mg/m\^2 of fludarabine followed by 2 g/m\^2 of cytarabine on
        Days 8-12. Gemtuzumab 3 mg/m\^2 will be given on Day 13 (only for participants with CD33 expression
        on leukemia blasts).

        '
