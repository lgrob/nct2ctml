    - arm_code: 'Arm A: Control Arm without Venetoclax'
      arm_internal_id: 0
      arm_description: 'During Cycle 1 (42-day-cycles), participants will receive 30 mg/m\^2 of fludarabine
        followed by 2 g/m\^2 of cytarabine on Days 1-5. Gemtuzumab 3 mg/m\^2 will be given on Day 6 (only
        for participants with CD33 expression on leukemia blasts).


        During Cycle 2 participants will receive 30 mg/m\^2 of fludarabine followed by 2 g/m\^2 of cytarabine
        on Days 1-5. After Cycle 2 participants are assessed for'
      arm_suspended: N
