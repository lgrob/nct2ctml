      arm_internal_id: 1
      arm_description: Patients with VLR RMS receive vincristine intravenously (IV)
        on day 1 of each cycle and days 8 and 15 of cycles 1, 3, 5, and 7 and dactinomycin
        IV over 1-5 minutes or over 10-15 minutes on day 1 of each cycle. Treatment
        repeats every 21 days for 8 cycles in the absence of disease progression or
        unacceptable toxicity. Patients with MYOD1 or TP53 mutated tumors transition
        to Regimen M at cycle 2 (if mutation status is determined to be positive at
        week 3) or cycle 3 (if mutation status is determined to be positive after
        week 3). Patients undergo CT scan, MRI, bone scan, PET scan and tumor biopsy
        throughout the study.
