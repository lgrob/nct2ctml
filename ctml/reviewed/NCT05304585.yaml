status: open to accrual
summary: Rhabdomyosarcoma is a type of cancer that occurs in the soft tissues in the
  body. This phase III trial aims to maintain excellent outcomes in patients with
  very low risk rhabdomyosarcoma (VLR-RMS) while decreasing the burden of therapy
  using treatment with 24 weeks of vincristine and dactinomycin (VA) and examines
  the use of centralized molecular risk stratification in the treatment of rhabdomyosarcoma.
  Another aim of the study it to find out how well patients with low risk rhabdomyosarcoma
  (LR-RMS) respond to standard chemotherapy when patients with VLR-RMS and patients
  who have rhabdomyosarcoma with DNA mutations get separate treatment. Finally, this
  study examines the effect of therapy intensification in patients who have RMS cancer
  with DNA mutations to see if their outcomes can be improved.
