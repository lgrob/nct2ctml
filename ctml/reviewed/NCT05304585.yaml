    step_type: Registration
    arm:
    - arm_code: Regimen M (positive mutation)
      arm_internal_id: 0
      arm_description: Patients receive vincristine IV on day 1 of each cycle and
        days 8 and 15 of cycles 2-4, 7-8, and 11-12 and dactinomycin IV over 1-5 minutes
        or 10-15 minutes on day 1 of cycles 2-5 and 8-14. Patients also receive cyclophosphamide
        IV over 60 minutes on day 1 of each cycle. Treatment repeats every 21 days
        for 12-13 cycles in the absence of disease progression or unacceptable toxicity.
        Patients may also undergo radiation therapy at cycle 5. Patients undergo CT
        scan, MRI, bone scan, PET scan and tumor biopsy throughout the study.
