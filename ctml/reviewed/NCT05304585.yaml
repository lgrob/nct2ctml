      arm_internal_id: 2
      arm_description: Patients with LR RMS receive vincristine IV on day 1 of each
        cycle and days 8 and 15 of cycles 1-3. Patients also receive dactinomycin
        IV over 1-5 minutes or 10-15 minutes and cyclophosphamide IV over 60 minutes
        on day 1 of each cycle. Treatment repeats every 21 days for 4 cycles in the
        absence of disease progression or unacceptable toxicity. Patients then receive
        vincristine IV on day 1 of each cycle and days 8 and 15 of cycles 5-7 and
        dactinomycin IV over 1-5 minutes or over 10-15 minutes on day 1 of each cycle.
        Treatment repeats every 21 days for 4 cycles in the absence of disease progression
        or unacceptable toxicity. Patients with MYOD1 or TP53 mutated tumors transition
        to Regimen M at cycle 2 (if mutation status is determined to be positive at
        week 3) or cycle 3 (if mutation status is determined to be positive after
        week 3). Radiation therapy (if needed) will be administered at cycle 5.Patients
        undergo CT scan, MRI, bone scan, PET scan and tumor biopsy throughout the
        study.
