status: open to accrual
summary: "The objective of the trial is to evaluate the safety, clinical toxicity\
  \ and in vivo immunological effects of MOR00208 in pediatric patients with acute\
  \ lymphoblastic leukemia who showed newly emerging or persistent MRD after a first\
  \ stem cell transplantation, received stem cell transplantation without having reached\
  \ a sufficient molecular remission prior to transplant (defined as MRD \u226510E-4)\
  \ irrespective of MRD after SCT or underwent a second or subsequent stem cell transplantation\
  \ irrespective of MRD after SCT.\n\nPart I: to determine the recommended dose of\
  \ MOR00208 in pediatric patients Part II: to evaluate the time until hematological\
  \ relapse or increase of MRD"
