status: open to accrual
summary: This is a prospective, multicenter clinical trial in subjects with newly
  diagnosed high-risk neuroblastoma to evaluate the efficacy and safety of administering
  naxitamab with standard induction therapy. The initial chemotherapy will include
  5 cycles of multi-agent chemotherapy. Naxitamab will be added to all 5 Induction
  cycles. We hypothesize that the addition of anti-GD2 therapy to induction chemotherapy
  will result in improved end of induction responses and improved survival.
