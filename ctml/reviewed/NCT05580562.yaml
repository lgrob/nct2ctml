summary: Randomized, double-blind, placebo-controlled Phase 3 study of dordaviprone (ONC201) in patients
  with newly diagnosed H3 K27M-mutant diffuse glioma following radiotherapy.
prior_treatment_requirements:
- Completed frontline radiotherapy 2 to 6 weeks prior to randomization.
- Radiotherapy initiated within 12 weeks of initial diagnosis.
- No prior dordaviprone (ONC201) or ONC206 at any time.
- No systemic bevacizumab since initial diagnosis.
- Body weight >= 10 kg. Karnofsky or Lansky performance status >= 70.
