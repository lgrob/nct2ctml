status: open to accrual
summary: HEM-iSMART is a master protocol which investigates multiple investigational
  medicinal products in children, adolescents and young adults (AYA) with relapsed/refractory
  (R/R) ALL and LBL. Sub-protocol D is a phase I/II trial evaluating the safety and
  efficacy of trametinib in combination with dexamethasone, cyclophosphamide and cytarabine
  in children and AYA with R/R ped ALL/LBL whose tumor present with alterations in
  the RAS-RAF-MAPK pathway.
treatment_list:
  step:
  - step_internal_id: 111
    step_code: '1'
    step_type: Registration
    arm:
    - arm_code: Sub-study D
      arm_internal_id: 0
      arm_description: 'Trametinib + dexamethasone + cyclophosphamide and cytarabine.


        Each cycle lasts 28 days.


        Cycle 1: Trametinib is given orally continuously once a day in tablets or
        oral formulation depending on the age and weight of the patient. Dexamethasone
        is given intravenously (IV)/orally on days 1 to 5. Cyclophosphamide is given
        IV on day 3. Cytarabine is given IV in two blocks of 4 days each one week
        apart from day 5.


        Cycle 2 and subsequent cycles: Trametinib is given orally continuously once
        a day in tablets or oral formulation depending on the age and weight of the
        patient. Dexamethasone is given intravenously (IV)/orally on days 1 to 5.
        Cyclophosphamide is given IV on day 1. Cytarabine is given IV in two blocks
        of 4 days each one week apart from day 3.


        Patients in dose level -1, receive only 1 block of cytarabine per cycle.


        All patients receive age adapted intrathecal chemotherapy.'
      arm_suspended: N
      dose_level:
