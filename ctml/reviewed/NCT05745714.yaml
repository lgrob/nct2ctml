summary: HEM-iSMART is a master protocol which investigates multiple investigational
  medicinal products in children, adolescents and young adults (AYA) with relapsed/refractory
  (R/R) ALL and LBL. Sub-protocol C is a phase I/II trial evaluating the safety and
  efficacy of ruxolitinib and venetoclax in combination with dexamethasone, cyclophosphamide
  and cytarabine in children and AYA with R/R ped ALL/LBL whose tumor present with
  alterations in the IL7R/JAK-STAT pathway.
treatment_list:
  step:
  - step_internal_id: 111
    step_code: '1'
    step_type: Registration
    arm:
    - arm_code: Ruxolitinib + venetoclax + dexamethasone + cyclophosphamide + cytarabine
      arm_internal_id: 0
      arm_description: 'Each cycle has 28 days


        Cycle 1: All patients will receive 14 days of of ruxolitinib (days 1-14),
        28 days of venetoclax (days 1-28), one block of five days of dexamethasone
        (days 1-5), one dose of cyclophosphamide (day 3) and two blocks of four consecutive
        days of cytarabine (days 5 to 8 and days 12 to 15). A 1-day venetoclax ramp-up
        is proposed in this study.


        Cycle 2 and subsequent cycles:


        All patients will receive 14 days of of ruxolitinib (days 1-14), 28 days of
        venetoclax (days 1-28), one block of five days of dexamethasone (days 1-5),
        one dose of cyclophosphamide (day 1) and two blocks of four consecutive days
        of cytarabine (days 3 to 6 and days 10 to 13).


        Patients in dose level -1, will receive a lower dose of venetoclax compared
        to dose level 1.


        Patients in dose level 2, will receive a higher dose of venetoclax compared
        to dose level 1.


        All patients receive age adapted intrathecal chemotherapy.'
