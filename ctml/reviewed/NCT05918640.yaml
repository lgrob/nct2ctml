prior_treatment_requirements:
- 'Inclusion Criteria:'
- "1. Age \u2265 10 years."
- '2. Phase 1: Histological confirmed diagnosis of recurrent or relapsed solid tumor
  failing primary therapy. Patients must have a known FET fusion (fusion that contains
  EWSR1, FUS, or TAF15) as documented by next generation sequencing, polymerase chain
  reaction (PCR) or Fluorescence in situ hybridization (FISH). Patients with a histological
  diagnosis of Ewing sarcoma with EWS-FLI1 are eligible for dose escalation but not
  for the exploratory cohort. Please note patients with Ewing sarcoma and alternative
  FET-ETS fusions (including but not limited to EWS-ERG, EWS-ETV1, EWS-ETV4, EWS-FEV,
  FUS-ERG, FUS-FEV) are eligible for the exploratory cohort.'
- '3. Phase 2: Histologically confirmed diagnosis of recurrent or relapsed Ewing sarcoma
  failing primary therapy with confirmation of EWS-FLI1 fusion and breakpoint by Next
  generation sequencing or PCR or EWSR1 rearrangement confirmed by FISH and available
  tissue for central confirmation of EWS-FLI1 fusion and breakpoint.'
- 4. Eastern Cooperative Oncology Group (ECOG) Performance Status of 0 or 1 (age \>16
  years) or Lansky of at least 70 (age \<16 years).
- '5. Disease status (baseline imaging must be performed within 28 days of Day 1 of
  study treatment):'
- '1. Phase 1: At least one site of measurable disease on CT or MRI as defined by
  RECIST 1.1 OR evaluable disease with at least one site of disease that has not been
  previously radiated'
- '2. Phase 2: At least one site of measurable disease on CT or MRI as defined by
  RECIST 1.1'
- '6. Meets organ function requirements as outlined below:'
- '1. Liver:'
- "Alanine aminotransferase (ALT) \u2264 2.5X upper limit of normal. For the purposes\
  \ of this study the upper limit of normal for ALT is 45 U/L. Aspartate aminotransferase\
  \ (AST) \u2264 2.5X upper limit of normal. For the purposes of this study the upper\
  \ limit of normal for AST is 50 U/L. Total bilirubin \u2264 1.5X institutional upper\
  \ limit of normal with the exception of patients with Gilbert's syndrome who must\
  \ have bilirubin \\<3X institutional upper limit of normal."
- '2. Renal:'
- "Creatinine Calculated creatinine clearance (by the Schwartz equation for patients\
  \ \\<18 years of age and Cockroft-Gault formula (Appendix B) for patients \u2265\
  18 years of age) or radionuclide glomerular filtration rate (GFR) \u2265 50 mL/min\
  \ /m2 or a serum creatinine less than or equal to the age/gender valued below:"
- Age Maximum Serum Creatinine (mg/dL) Male Female 10 to \< 13 years 1.2 1.2 13 to
  \< 16 years 1.5 1.4
- "\u2265 16 years 1.7 1.4"
- '3. Bone marrow:'
- "Absolute Neutrophil Count (ANC) \u2265 1,000/\xB5L (\\>one week since last dose\
  \ of short acting medications (e.g. filgrastim) and \\> two weeks since last dose\
  \ of long acting medications (e.g. peg-filgrastim)) Platelet Count (PLTs) \u2265\
  \ 100,000/ \xB5L (\\>two weeks since last dose of thrombopoietin receptor agonist\
  \ such as romiplostim and without platelet transfusion within previous 7 days of\
  \ screening laboratories) Patients with a history of bone marrow involvement are\
  \ required to have bilateral bone marrow aspirates and biopsies at baseline. Subjects\
  \ with bone marrow disease are eligible as long as they meet the hematologic requirements\
  \ above and are not known to be refractory to red cell or platelet transfusions."
- "4. Muscle: Creatine phosphokinase (CPK) CTCAE 5 Grade \u2264 1,"
- '5. Cardiac:'
- "Creatine phosphokinase CTCAE 5 Grade \u2264 l, Left ventricular ejection fraction\
  \ (LVEF) or shortening fraction (SF) per institutional norm LVEF \u226550% OR SF\
  \ \u226528%."
- 7. Written, voluntary informed consent
- '8. Fertile males and females of childbearing potential must agree to use an effective
  method of birth control from screening, through 7 months after last study drug administration
  for females and 4 months for males. Women of childbearing potential must have a
  negative pregnancy test during screening procedures. Effective methods of birth
  control include: double barrier method (condom, diaphragm), abstinence, an intrauterine
  device (IUD), levonorgestrol implants, medroxyprogesterone acetate injections, or
  oral contraception. For those subjects whose preferred and usual lifestyle employs
  abstinence, refraining from heterosexual intercourse must be practiced during the
  entire active phase of the trial.'
- "9. Patients \u226518 years must be willing to undergo tumor biopsy at study entry.\
  \ Patients with Ewing sarcoma or DSRCT must be willing to undergo biopsy post-treatment.\
  \ If biopsy is contraindicated, enrollment must be approved by study PI and archival\
  \ tissue must be available."
- '10. Time elapsed from previous therapy:'
- "1. Must be \u2265 3 weeks for systemic myelosuppressive therapy"
- "2. \u2265 2 weeks for local radiation therapy (small field), \u2265 150 days after\
  \ thyrotropin binding inhibition (TBI), craniospinal external beam radiotherapy\
  \ (XRT) or radiation to \u226550% of the pelvis"
- "3. \u2265 2 weeks for major surgery"
- "4. \u2265 2 weeks for monoclonal antibodies and oral kinase inhibitors."
- "5. \u2265 6 weeks for autologous stem cell transplant. 6 months for allogeneic\
  \ stem cell transplant."
- "6. \u2265 6 weeks for any type of cellular therapy"
- "11. Patients must be recovered to baseline or Grade \u22641from the acute adverse\
  \ effects of prior treatments, with the exception of alopecia and decreased deep\
  \ tendon reflexes."
- 'Exclude - Exclusion Criteria:'
- Exclude - 1. Prior therapy with trabectedin or lurbinectedin.
- Exclude - 2. Subjects with known brain metastases.
- Exclude - 3. Subjects with a known bleeding diathesis.
- Exclude - 4. Subjects who are pregnant or breastfeeding.
- 'Exclude - 5. Concurrent therapy:'
- Exclude - 1. Patients who are currently receiving an investigational drug or another
  anticancer agent
- Exclude - 2. Patients receiving over the counter or herbal supplement with significant
  potential hepatotoxicity in the opinion of the investigator.
- Exclude - 3. Patients receiving a medically necessary strong or moderate CYP3A4
  inhibitor or inducer within 14 days prior to the first dose of study drug.
- Exclude - 6. Clinically significant, unrelated illness or uncontrolled infection
  which would, in the opinion of the treating physician, compromise the patient's
  ability to tolerate the investigational agents or be likely to interfere with the
  study procedures or results.
- Exclude - 7. Subjects who, in the opinion of the investigator, may not be able to
  comply with the safety monitoring requirements of the study, or in whom compliance
  is likely to be suboptimal, should be excluded.
- Exclude - 8. Patients with known active viral hepatitis (i.e. Hepatitis A, B, or
  C)
- Exclude - 9. Patients with Desmoplastic small round cell tumor (DSRCT) will be excluded
  from enrollment until at least 3 non-DSRCT patients have been enrolled without dose
  limiting toxicity.
