      arm_internal_id: 1
      arm_description: 'The purpose of this part of the study is to find out if adding
        a drug called liposomal irinotecan (also called Onivyde) to standard chemotherapy/radiation/surgery
        will result in better treatment outcomes for patients with intermediate and
        high risk rhabdomyosarcoma. The investigators also want to find the best radiation
        dose to give for intermediate and high risk patients who have large tumors
        (\> 5 cm).


        The patient will receive 42 weeks of VAC chemotherapy (vincristine, actinomycin
        D/dactinomycin and cyclophosphamide) alternating with VLI chemotherapy (vincristine/liposomal
        irinotecan). The participant will also have surgery to remove the tumor and
        radiation therapy during this time. After this therapy is completed you will
        get an additional 6 months of maintenance chemotherapy with vinorelbine and
        oral (by mouth) cyclophosphamide.'
