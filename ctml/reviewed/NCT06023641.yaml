status: open to accrual
summary: 'This is a phase II study to determine safety and efficacy of combining liposomal
  irinotecan with vincristine alternating with VAC in intermediate-risk patients,
  liposomal irinotecan with temozolomide and vincristine alternating with VAC in high-risk
  patients and the chemotherapy combinations when given with concomitant radiation
  therapy in intermediate and high risk patients.


  Primary Objective


  * Estimate event-free survival for intermediate-risk participants treated with VAC
  and vincristine and liposomal irinotecan (VLI) with the addition of maintenance
  therapy with vinorelbine and cyclophosphamide.

  * Estimate the event-free survival for high-risk patients treated with VAC and vincristine,
  liposomal irinotecan, and temozolomide with the addition of maintenance therapy
  with vinorelbine and cyclophosphamide.


  Secondary Objectives


  * To assess the relation between pharmacogenetic variation in CEP72 genotype and
  vinca alkaloid (vincristine; vinorelbine) disposition in children with rhabdomyosarcoma.

  * To assess the relation between the pharmacogenetic variation in drug metabolizing
  enzymes and drug transporters, and the pharmacokinetics of vinca alkaloids, liposomal
  irinotecan, and cyclophosphamide in children with rhabdomyosarcoma.

  * To assess the extent of inter-patient variability in the pharmacokinetics of vinca
  alkaloids, liposomal irinotecan, and cyclophosphamide in children with rhabdomyosarcoma,
  and explore possible associations between drug disposition and patient specific
  covariates (e.g., age, sex, race, weight).

  * Estimate the cumulative incidence of local recurrence and overall 3-year event-free
  survival in patients with low-risk disease, intermediate-risk disease or high-risk
  disease treated with either no adjuvant radiation or minimal volume radiation and
  compare these outcomes with the outcomes achieved on RMS13.'
treatment_list:
  step:
  - step_internal_id: 111
    step_code: '1'
    step_type: Registration
    arm:
    - arm_code: Low -risk
      arm_internal_id: 0
      arm_description: 'The participant will receive 12 weeks (4 cycles) of VAC chemotherapy
        (vincristine, dactinomycin and cyclophosphamide) followed by 12 weeks (4 cycles)
        of VA chemotherapy (vincristine, dactinomycin).


        Each cycle of VAC/VA chemotherapy will last for 3 weeks, for a total of 12
        weeks (VAC or VA will be given in Week 1 of each cycle and vincristine will
        be given Weeks 2 and 3). At week 12, the participant will have scans and tests
        to reevaluate your tumor''s response to the treatment. After surgery and radiation,
        the participant will receive an additional 12 weeks (4 cycles) of the same
        chemotherapy without cyclophosphamide. Vincristine and dactinomycin, also
        called "VA". After 4 cycles of VA, The investigator will re-evaluate the tumor
        again at week 24 and the patient will not get any more chemotherapy, but will
        be closely watched for any signs of tumor recurrence.'
      arm_suspended: N
      dose_level:
