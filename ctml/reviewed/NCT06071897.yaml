      arm_description: '\* days of 21 days schedule N5


        * Vincristine 1,5 mg/m2 i.v., day 1\*

        * Etoposide 100 mg/m2 i.v. , days 1-4\*

        * Cisplatin 100 mg/m2 i.v., days 1-4\* N6

        * Vincristine 1,5 mg/m2 i.v. on days 1, 8\*

        * Dacarbasine 200 mg/m2 i.v., days 1-5\*

        * Ifosphamide 1500 mg/m2 i.v, days 1-5\*

        * Doxorubicin 30 mg/m2 i.v, days 6, 7\*


        N5Q


        * N5 (see above)

        * Dinutuximab beta 10 mg/m2 i.v., days 5-9\*


        G-CSF (granulocyte colony-stimulating factor) 5 mcg/kg s.c. on day 9 until
        the ANC is more than 2000 /ml or until counts have recovered for the next
        cycle of therapy


        N6Q


        * N6 (see above)

        * Dinutuximab beta 10 mg/m2 i.v., days 6-10\*


        G-CSF (granulocyte colony- stimulating factor) 5 mcg/kg s.c. on day 10 until
        the ANC is more than 2000 /ml or until counts have recovered for the next
        cycle of therapy


        Delayed surgery (if needed) will be done after the 4th or 6th course of induction
        therapy and stem cells apheresis after the 2nd-5th course of induction therapy.'
