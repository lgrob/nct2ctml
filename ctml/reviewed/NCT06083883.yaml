    step_type: Registration
    arm:
    - arm_code: Dose escalation - Inpatient and Outpatient
      arm_internal_id: 0
      arm_description: Participants will be assigned to receive a dose level of NK
        cells based on when the participants joins the study. Up to 6 participants
        will be enrolled at each dose level. If no intolerable side effects are seen
        after the first 3-6, the next group of participants will get at higher dose.
        Up to 4 dose levels of NK cells will be tested. If the first dosing group
        shows intolerable side effects, a lower dose will be tested.
