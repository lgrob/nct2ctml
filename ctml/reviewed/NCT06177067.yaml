prior_treatment_requirements:
- 'Inclusion Criteria: Participants must have a diagnosis of AML or ALAL and meet
  the criteria below:'
- "* Refractory leukemia, defined as persistent leukemia after at least two courses\
  \ of induction chemotherapy (one course for secondary AML), or relapsed leukemia,\
  \ defined as the re-appearance of leukemia after the achievement of remission. Patients\
  \ must have \u22655% blasts in the bone marrow as assessed by morphology or \u2265\
  1% blasts flow cytometry."
- "However, if an adequate bone marrow sample cannot be obtained (e.g., in a patient\
  \ with acute megakaryoblastic leukemia with marrow fibrosis), patients may be enrolled\
  \ if there is unequivocal evidence of leukemia with \u22655% blasts by morphology\
  \ or \u22651% blasts flow cytometry in the blood."
- '* Presence of KMT2A rearrangement (KMT2Ar), NUP98 rearrangement (NUP98r), NPM1
  mutation or fusion, PICALM::MLLT10, DEK::NUP214, UBTF-TD, KAT6A rearrangement (KAT6Ar),
  or SET::NUP214'
- "* Adequate organ function, defined as total bilirubin \\< 1.5 \xD7 institutional\
  \ upper limit of normal for age or normal conjugated bilirubin (for patients with\
  \ known Gilbert's syndrome, total bilirubin \\<3 \xD7 the ULN) unless attributed\
  \ to leukemia, calculated creatinine clearance \u226560 mL/min/1.73 m\\^2, and left\
  \ ventricular ejection fraction \u2265 40%"
- '* QTcF \< 480 msec (average of triplicate)'
- "* Age \u2265 1 year and \u2264 30 years. The upper age limit may be defined by\
  \ each institution, but may not exceed 30 years."
- "* Lansky \u2265 60 for patients who are \\< 16 years old and Karnofsky \u2265 60%\
  \ for patients who are \\> 16 years old."
- '* At least 14 days or 5 half-lives (whichever is longer) must have elapsed since
  the completion of myelosuppressive therapy, with the exception of low-dose therapy
  used for cytoreduction according to institutional standards, such as hydroxyurea
  or low-dose cytarabine (up to 200 mg/m\^2/day). In addition, all toxicities must
  have resolved to grade 1 or less.'
- '* Patients must have a leukocyte count \<25,000 cells/uL. Low-dose therapy, such
  as hydroxyurea or cytarabine as described above, to achieve this limit is acceptable.'
- '* For patients who have received prior HCT, there can be no evidence of GVHD and
  greater than 60 days must have elapsed since the HCT, and patients should be off
  calcineurin inhibitors for at least 28 days prior to the start of protocol therapy.
  Physiologic prednisone for the treatment of adrenal insufficiency is acceptable..'
- '* Patients must be taking posaconazole or voriconazole, which must be started at
  least 24 hours prior to the start of therapy.'
- '* Patients of reproductive potential must agree to use effective contraception
  for the duration of study participation.'
- Patients who meet the criteria listed above are eligible for enrollment and treatment
  on the trial. However, patients in first relapse who are suitable for and willing
  to receive intensive remission induction therapy should be offered such therapy
  if deemed appropriate by the treating physician.
- 'Exclude - Exclusion Criteria:'
- Exclude - * Patients who are pregnant or breastfeeding are not eligible.
- Exclude - * Patients with Down syndrome, acute promyelocytic leukemia, juvenile
  myelomonocytic leukemia, or bone marrow failure syndromes are not eligible.
- Exclude - * Patients with uncontrolled infection are not eligible. Patients with
  infections that are controlled on concurrent anti-microbial agents are eligible.
