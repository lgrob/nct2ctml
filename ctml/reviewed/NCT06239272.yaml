summary: 'The study participant has been diagnosed with non-rhabdomyosarcoma (NRSTS).


  Primary Objectives


  Intermediate-Risk


  * To estimate the 3-year event-free survival for intermediate-risk patients treated with ifosfamide,
  doxorubicin, pazopanib, surgery, and maintenance pazopanib, with or without RT.

  * To characterize the pharmacokinetics of pazopanib and doxorubicin in combination with ifosfamide in
  intermediate-risk participants, to assess potential covariates to explain the inter- and intra-individual
  pharmacokinetic variability, and to explore associations between clinical effects and pazopanib and
  doxorubicin pharmacokinetics.


  High-Risk


  * To estimate the maximum tolerated dose (MTD) and/or the recommended phase 2 dosage (RP2D) of selinexor
  in combination with ifosfamide, doxorubicin, pazopanib, and maintenance pazopanib in high-risk participants.

  * To characterize the pharmacokinetics '
