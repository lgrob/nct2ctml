summary: 'The study participant has been diagnosed with non-rhabdomyosarcoma (NRSTS).


  Primary Objectives


  Intermediate-Risk


  * To estimate the 3-year event-free survival for intermediate-risk patients treated
  with ifosfamide, doxorubicin, pazopanib, surgery, and maintenance pazopanib, with
  or without RT.

  * To characterize the pharmacokinetics of pazopanib and doxorubicin in combination
  with ifosfamide in intermediate-risk participants, to assess potential covariates
  to explain the inter- and intra-individual pharmacokinetic variability, and to explore
  associations between clinical effects and pazopanib and doxorubicin pharmacokinetics.


  High-Risk


  * To estimate the maximum tolerated dose (MTD) and/or the recommended phase 2 dosage
  (RP2D) of selinexor in combination with ifosfamide, doxorubicin, pazopanib, and
  maintenance pazopanib in high-risk participants.

  * To characterize the pharmacokinetics of selinexor, pazopanib and doxorubicin in
  combination with ifosfamide in high-risk participants, to assess potential covariates
  to explain the inter- and intra-individual pharmacokinetic variability, and to explore
  associations between clinical effects and selinexor, pazopanib and doxorubicin pharmacokinetics.


  Secondary Objectives


  * To estimate the cumulative incidence of primary site local failure and distant
  metastasis-free, disease-free, event-free, and overall survival in participants
  treated on the risk-based treatment strategy defined in this protocol.

  * To define and describe the CTCAE Grade 3 or higher toxicities, and specific grade
  1-2 toxicities, in low- and intermediate-risk participants.

  * To study the association between radiation dosimetry in participants receiving
  radiation therapy and the incidence and type of dosimetric local failure, normal
  adjacent tissue exposure, and musculoskeletal toxicity.

  * To evaluate the objective response rate (complete and partial response) after
  3 cycles for high-risk patients receiving the combination of selinexor with ifosfamide,
  doxorubicin, pazopanib, and maintenance pazopanib.

  * To assess the relationship between the pharmacogenetic variation in drug-metabolizing
  enzymes or drug transporters and the pharmacokinetics of selinexor, pazopanib, and
  doxorubicin in intermediate- or high-risk patients.


  Exploratory Objectives


  * To explore the correlation between radiographic response, pathologic response,
  survival, and toxicity, and tumor molecular characteristics, as assessed through
  next-generation sequencing (NGS), including whole genome sequencing (WGS), whole
  exome sequencing (WES), and RNA sequencing (RNAseq).

  * To explore the feasibility of determining DNA mutational signatures and homologous
  repair deficiency status in primary tumor samples and to explore the correlation
  between these molecular findings and the radiographic response, survival, and toxicity
  of patients treated on this protocol.

  * To explore the feasibility of obtaining DNA methylation profiling on pretreatment,
  post-induction chemotherapy, and recurrent (if possible) tumor material, and to
  assess the correlation with this and pathologic diagnosis, tumor control, and survival
  outcomes where feasible.

  * To explore the feasibility of obtaining high resolution single-cell RNA sequencing
  of pretreatment, post-induction chemotherapy, and recurrent (if possible) tumor
  material, and to characterize the longitudinal changes in tumor heterogeneity and
  tumor microenvironment.

  * To explore the feasibility of identifying characteristic alterations in non-rhabdomyosarcoma
  soft tissue sarcoma in cell-free DNA (cfDNA) in blood as a non-invasive method of
  detecting and tracking changes during therapy, and to assess the correlation of
  cfDNA and mutations in tumor samples.

  * To describe cardiovascular and musculoskeletal health, cardiopulmonary fitness
  among children and young adults with NRSTS treated on this protocol.

  * To investigate the potential prognostic value of serum cardiac biomarkers (high-sensitivity
  cardiac troponin I (hs-cTnI), N-terminal pro B-type natriuretic peptide (NT-Pro-BNP),
  serial electrocardiograms (EKGs), and serial echocardiograms in patients receiving
  ifosfamide, doxorubicin, and pazopanib, with or without selinexor.

  * To define the rates of near-complete pathologic response (\>90% necrosis) and
  change in FDG PET maximum standard uptake value (SUVmax) from baseline to week 13
  in intermediate risk patients with initially unresectable tumors treated with induction
  pazopanib, ifosfamide, and doxorubicin, and to correlate this change with tumor
  control and survival outcomes.

  * To determine the number of high-risk patients initially judged unresectable at
  diagnosis that are able to undergo primary tumor resection after treatment with
  ifosfamide, doxorubicin, selinexor, and pazopanib.

  * To identify the frequency with which assessment of volumes of interest (VOIs)
  of target lesions would alter RECIST response assessment compared with standard
  linear measurements.'
treatment_list:
  step:
  - step_internal_id: 111
    step_code: '1'
    step_type: Registration
    arm:
    - arm_code: Low-Risk Subset A
      arm_internal_id: 0
      arm_description: Participants with low grade tumors of any size, or high-grade
        tumors \< 5 cm that have been (or are expected to be) completely removed by
        surgery. When the pathologist reviews the tumor specimen, the tissue around
        the tumor (margins) must be negative for cancer cells, meaning all of the
        cancer has been removed. These participants will have surgery to remove the
        tumor, followed by close observation. There will no further therapy after
        surgery, just monitoring for tumor recurrence and any side effects from surgery.
      arm_suspended: N
      dose_level:
      - level_code: '0'
        level_description: 'Procedure: Surgical resection'
        level_internal_id: 0
        level_suspended: N
      - level_code: '1'
        level_description: 'Radiation: Proton beam radiation therapy'
        level_internal_id: 1
        level_suspended: N
    - arm_code: Low-Risk Subset B
      arm_internal_id: 1
      arm_description: Participants with high-grade tumors that are \< 5 cm with positive
        margins. This means that the pathologist finds cancer cells at the edge of
        the tissue, suggesting that all of the cancer has not been removed. These
        participants will have surgery followed by radiation therapy for about 5-6
        weeks.
      arm_suspended: N
      dose_level:
      - level_code: '0'
        level_description: 'Procedure: Surgical resection'
        level_internal_id: 0
        level_suspended: N
      - level_code: '1'
        level_description: 'Radiation: Proton beam radiation therapy'
        level_internal_id: 1
        level_suspended: N
    - arm_code: 'Intermediate-Risk Subset A (participants with low grade tumors):'
      arm_internal_id: 2
      arm_description: '* If your tumor is completely removed at surgery \[meaning
        the tissue around the tumor (margins) is negative for tumor cells\], you will
        receive no further therapy and you will be closely observed for any signs
        of tumor recurrence.

        * If your tumor cannot be completely removed at surgery \[meaning the tissue
        around the tumor (margins) is positive for tumor cells\] and the tumor is
        low-grade, you will get consolidation therapy with additional chemotherapy
        and radiation therapy, followed by 6 months of maintenance therapy with pazopanib.'
      arm_suspended: N
      dose_level:
