prior_treatment_requirements:
- 'Inclusion Criteria:'
- Inclusion Criteria - All Patients
- '* Patients must be 1-30 years at the time of the biopsy that established the diagnosis
  of NRSTS.'
- '* Surgical Resection: Patients who had an upfront resection prior to enrollment
  will be eligible if they are able to begin therapy within 28 days of resection assuming
  other eligibility criteria are met. Delayed resection is preferred for all patients
  with intermediate and high-risk disease.'
- "* Lansky performance status score \u2265 60 for patients \u2264 16 years of age.\
  \ Karnofsky performance status score \u2265 60 for patients \\>16 years of age.\
  \ Note patients who are unable to walk because of paralysis, but who are up in a\
  \ wheelchair, will be considered ambulatory for the purpose of assessing the performance\
  \ score."
- Diagnosis
- "\u2022 Patients with CIC-DUX 4 rearranged sarcomas will be enrolled on the high-risk\
  \ stratum only, regardless of presence of metastasis, size, or resection status."
- 'Patient has low-risk disease if the patient has a:'
- '* Low-grade tumor of any size where R0 or R1 surgical margins are anticipated or
  achieved.'
- '* High-grade tumors that are \< 5 cm where R0 or R1 resection margins are anticipated
  or achieved.'
- Patient must have adequate organ function in the organs that will be within the
  radiotherapy field.
- 'Adequate renal function defined as:'
- '* Creatinine clearance or radioisotope GFR \> 70 mL/min/1.73 m2, or'
- '* A normal serum creatinine based on age/gender as follows'
- Age Maximum Serum Creatinine (mg/dL) Male Female 2 to \< 6 years 0.8 0.8 6 to \<
  10 years 1 1 10 to \< 13 years 1.2 1.2 13 to \< 16 years 1.5 1.4 \> 16 years 1.5
  1.4
- 'Adequate liver function defined as:'
- '* Total bilirubin \< 1.5 x upper limit of normal (ULN) for age'
- '* SGOT (AST) or SGPT (ALT) \< 2.5 x ULN for age'
- 'Adequate cardiac function defined as:'
- '* Ejection fraction of \> 55% by echocardiogram or cardiac MRI'
- '* QTc \< 480 msec'
- 'Adequate pulmonary function defined as:'
- '* No evidence of dyspnea at rest, no exercise intolerance, and a resting pulse
  oximetry reading \> 94% on room air if there is clinical indication for determination.'
- Inclusion Criteria - Intermediate and High Risk Participants
- 'Patient has intermediate-risk if the patient has a:'
- '* Low-grade non-metastatic initially unresectable disease at study enrollment where
  delayed resection is planned.'
- '* High-grade \< 5 cm non-metastatic initially unresectable disease at study enrollment
  where delayed resection is planned. Of note, patients enrolled on the low-risk arm
  who were unable to achieve gross total resection where delayed re-resection is planned
  are eligible for this arm.'
- '* High-grade tumor \> 5 cm that is potentially resectable.'
- 'Patient high-risk if the patient has:'
- '* Metastatic disease at presentation'
- '* Unresectable disease at study enrollment where delayed resection is not anticipated.
  Of note, patients enrolled on the low-risk arm who were unable to achieve gross
  total resection where delayed re-resection is not-planned are eligible for this
  arm.'
- '* CIC-DUX4 rearranged sarcoma'
- Organ Function
- 'Adequate bone marrow function defined as:'
- "* Absolute neutrophil count \\> 1000/\xB5L"
- "* Platelet count \\> 100,000/\xB5L"
- '* Hemoglobin \> 8 g/dL for patients \< 16 years of age'
- '* Hemoglobin \> 9 g/dL for patients \> 16 years of age'
- 'Note: No transfusions are permitted 7 days prior to laboratory studies to determine
  eligibility.'
- 'Adequate renal function defined as:'
- '* Creatinine clearance or radioisotope GFR \> 70 mL/min/1.73 m2, or'
- '* A normal serum creatinine based on age/gender as follows'
- Age Maximum Serum Creatinine (mg/dL) Male Female 2 to \< 6 years 0.8 0.8 6 to \<
  10 years 1 1 10 to \< 13 years 1.2 1.2 13 to \< 16 years 1.5 1.4 \> 16 years 1.5
  1.4
- 'Adequate liver function defined as:'
- '* Total bilirubin \< 1.5 x upper limit of normal (ULN) for age'
- '* SGOT (AST) or SGPT (ALT) \< 2.5 x ULN for age'
- 'Adequate cardiac function defined as:'
- '* Ejection fraction of \> 55% by echocardiogram or cardiac MRI'
- '* QTc \< 480 msec'
- 'Adequate pulmonary function defined as:'
- '* No evidence of dyspnea at rest, no exercise intolerance, and a resting pulse
  oximetry reading \> 94% on room air if there is clinical indication for determination.'
- Anticoagulation
- Patients on low molecular weight heparin, warfarin (with a stable INR), or direct
  oral anticoagulants (DOAC) who have been on a stable dose of are eligible. Patients
  being treated for a pulmonary embolism or deep venous thrombosis (DVT) must have
  been treated for a minimum of 6 weeks prior to starting therapy treatment.
- Life Expectancy
- Patient must have a life expectancy of at least 3 months with appropriate therapy.
- 'Exclude - Exclusion Criteria:'
- 'Exclude - * Patients with known primary CNS sarcoma or CNS metastases are not eligible.
  Note: Brain imaging is not an eligibility requirement. Tumors with intracranial
  extension will be allowed.'
- 'Exclude - * Patients with the following histologic diagnosis are not eligible:
  intermediate locally aggressive tumors as defined by WHO, malignant rhabdoid tumor,
  alveolar soft part sarcoma, infantile fibrosarcoma, unresectable/metastatic dermatofibrosarcoma
  protuberans, inflammatory myofibroblastic tumor, desmoid fibromatosis, rhabdomyosarcoma,
  desmoplastic small round cell tumor, BCOR-CCNB3 fusion positive sarcoma.'
- 'Exclude - * Bleeding diathesis: Patients with evidence of active bleeding or bleeding
  diathesis will be excluded (Note: Patients aged \> 17 years with excess of 2.5 mL
  of hemoptysis are not eligible).'
- "Exclude - * Uncontrolled hypertension: Patients with uncontrolled hypertension\
  \ (CTCAE v5 Grade \u2265 2) are ineligible. Hypertension must be well controlled\
  \ on stable doses of medication for at least two weeks."
- Exclude - Prior Therapy
- Exclude - * Patients must have had no prior systemic therapy for the treatment of
  the NRSTS
- Exclude - * Patients must have had no prior anthracycline or ifosfamide chemotherapy
- Exclude - * Patients must have had no prior use of pazopanib or similar multi-targeted
  TKI.
- Exclude - Patients must have had no prior radiotherapy to tumor-involved sites.
- 'Exclude - Note: Patients previously treated for a non-NRSTS cancer are eligible
  provided they meet the prior therapy requirements. Patients who have had chemotherapy
  or radiotherapy within 4 weeks (6 weeks for nitrosoureas or mitomycin C) prior to
  entering the study or those who have not recovered from adverse events due to agents
  administered more than 4 weeks earlier are excluded.'
- 'Exclude - * CYP3A4 Substrates WITH Narrow Therapeutic Indices: Patients chronically
  receiving medications known to be metabolized by CYP3A4 and with narrow therapeutic
  indices within 7 days prior to study enrollment, including but not limited to pimozide,
  aripiprazole, triazolam, ergotamine and halofantrine are not eligible. Note: the
  use of fentanyl is permitted.'
- 'Exclude - * CYP3A4 Inhibitors: Patients chronically receiving drugs that are known
  potent CYP3A4 inhibitors within 7 days prior to study enrollment, including but
  not limited to itraconazole, clarithromycin, erythromycin, many NNRTIs, diltiazem,
  verapamil, and grapefruit juice are not eligible.'
- 'Exclude - * CYP3A4 Inducers: Patients chronically receiving drugs that are known
  potent CYP3A4 inducers within 14 days prior to study enrollment, including but not
  limited to carbamazepine, phenobarbital, phenytoin, rifampin, and St. John''s wort
  are not eligible (with the exception of glucocorticoids).'
- Exclude - * Certain medications that are associated with a risk for QTc prolongation
  and/or Torsade's de Pointes, although not prohibited, should be avoided or replaced
  with medications that do not carry these risks, if possible.
- 'Exclude - * Subjects with any condition that may impair the ability to absorb oral
  medications/investigational product including:'
- Exclude - * prior surgical procedures affecting absorption including, but not limited
  to major resection of stomach or small bowel
- Exclude - * active peptic ulcer disease
- Exclude - * malabsorption syndrome
- 'Exclude - 3.4.12 Thyroid Replacement Therapy: Patients who require thyroid replacement
  therapy are not eligible if they have not been receiving a stable replacement dose
  for at least 4 weeks prior to study enrollment.'
- 'Exclude - 3.4.13 Subjects with any condition that may increase the risk of gastrointestinal
  bleeding or gastrointestinal perforation, including:'
- Exclude - * active peptic ulcer disease
- Exclude - * known intraluminal metastatic lesions
- Exclude - * inflammatory bowel disease (e.g., ulcerative colitis, Crohn's disease)
  or other gastrointestinal conditions which increase the risk of perforation
- Exclude - * history of abdominal fistula, gastrointestinal perforation or intra-
  abdominal abscess within 28 days prior to beginning study treatment.
- 'Exclude - 3.4.14 Pulmonary embolism or DVT. Patients must not have experienced:'
- Exclude - * An untreated pulmonary embolism or DVT in last 6 months or
- Exclude - * treated pulmonary embolism or DVT which has been treated with therapeutic
  anticoagulation for less than 6 weeks
- Exclude - * arterial thrombosis in last 12 months
- Exclude - History of serious or non-healing wound, ulcer, or bone fracture.
- Exclude - Uncontrolled intercurrent illness including, but not limited to, ongoing
  or active infection, symptomatic congestive heart failure, unstable angina pectoris,
  cardiac arrhythmia, or psychiatric illness/social situations that would limit compliance
  with study requirements.
- Exclude - HIV-positive subjects on combination antiretroviral therapy are ineligible
  because of the potential for pharmacokinetic interactions with pazopanib. In addition,
  these subjects are at increased risk of lethal infections when treated with marrow-suppressive
  therapy.
- Exclude - Patients who are receiving any other investigational agent(s).
- Exclude - Pregnancy and Breast Feeding
- Exclude - * Pregnancy and Breast Feeding Female patients who are pregnant are ineligible
  due to risks of fetal and teratogenic adverse events as seen in animal/human studies.
- Exclude - * Lactating females are not eligible unless they have agreed not to breastfeed
  their infants during treatment and for a period of 1 month following completion
  of treatment.
- Exclude - * Female patients of childbearing potential are not eligible unless a
  negative pregnancy test result has been obtained.
- Exclude - * Unwillingness to use an effective contraceptive method for the duration
  of their study participation and for at least 1 month after treatment is completed
  if sexually active with reproductive potential.
