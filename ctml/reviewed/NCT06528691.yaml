status: open to accrual
summary: This clinical trial tests how well entrectinib works to treat patients less
  than 3 years of age with NTRK 1/2/3 or ROS1 fused, high grade glioma or other central
  nervous system (CNS) tumors.
treatment_list:
  step:
  - step_internal_id: 111
