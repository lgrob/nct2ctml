    step_type: Registration
    arm:
    - arm_code: Entrectinib therapy, Cohort 1 and Cohort 2
      arm_internal_id: 0
      arm_description: 'Cohort 1: Patients who are younger than 3 years of age diagnosed
        with NTRK1/2/3- or ROS1-fused high-grade glioma (HGG) will receive therapy
        as outline in Detailed Description.


        Cohort 2: Patients who are younger than 3 years of age diagnosed with NTRK1/2/3-
        or ROS1-fused CNS tumors other than HGG will receive therapy as outline in
        Detailed Description.'
