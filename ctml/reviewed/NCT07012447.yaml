        \ D2, 400 mg D3-28) and azacitidine (75 mg/m\xB2 SC D1-7); Consolidation:\
        \ For fit patients, if those with MRD (Minimal Residual Disease) are negative\
        \ or refuse to undergo allo-HSCT (Hematopoietic stem-cell transplantation),\
        \ intermediate-dose (2g/m\xB2 q12h, days 1-3) cytarabine-based therapy is\
        \ administered for 3-4 cycles; if patients are MRD-positive, they undergo\
        \ allo-HSCT.\n\nFor unfit patients, each venetoclax combined with azacitidine\
        \ treatment cycle is anticipated to be 28 days in length until progression\
        \ of disease, although cycle delays may occur due to delayed blood count recovery."
