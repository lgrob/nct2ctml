prior_treatment_requirements:
- 'Inclusion Criteria:'
- 1. No gender restrictions
- "2. Age \u2265 14 years"
- '3. Confirmed diagnosis of one of the following:'
- "ETP-like leukemia (CD7\u207A, CD1a-, CD8-, with CD5 expression stratified as ETP-ALL\
  \ \u226475% or Near-ETP-ALL \\>75%) T-cell acute lymphoblastic leukemia (T-ALL)\
  \ with myeloid mutations (including FLT3, DNMT3A, STAG2, IDH1/2, RUNX1, EZH2, WT1,\
  \ ASXL1/2, SF3B1, TET2, BCOR, BCORL1, and MLL-PTD) T/myeloid mixed phenotype acute\
  \ leukemia (T/My-MPAL) (with concurrent T-lineage and myeloid markers, e.g., cCD3\u207A\
  /mCD3\u207A, CD7\u207A, MPO\u207A)"
- '4. Newly diagnosed patients without prior induction therapy Limited prior therapy
  allowed: hydroxyurea, dexamethasone, or low-dose cytarabine/venetoclax (cumulative
  dose \<0.5g), and leukocytapheresis'
- "5. Expected survival time \u2265 3 months"
- "6. Liver function: total bilirubin \u2264 2\xD7 ULN; ALT/AST \u2264 3\xD7 ULN (or\
  \ \u2264 5\xD7 ULN if liver infiltration by leukemia is present) ; Renal function:\
  \ endogenous creatinine clearance \u2265 30 ml/min; Cardiac function: left ventricular\
  \ ejection fraction \\> 45%"
- 7. Demonstrated capacity to understand the study and willingness to provide informed
  consent
- 'Exclude - Exclusion Criteria:'
- Exclude - 1. Presence of recurrent genetic abnormalities such as t(8;21), t(15;17),
  inv(16)/t(16;16) leukemia
- Exclude - 2. Prior hypersensitivity to study drugs or compounds of similar chemical
  structure
- Exclude - 3. Active uncontrolled infections as determined by the investigator
- Exclude - 4. Active bleeding
- Exclude - 5. Recent history (within 1 year) of thrombosis, embolism, or cerebral
  hemorrhage
- Exclude - 6. Pregnancy, breastfeeding, or unwillingness to use contraception in
  women of childbearing potential
- Exclude - 7. Drug addiction or chronic alcoholism that could interfere with trial
  evaluation
- Exclude - 8. Psychiatric disorders or other conditions that would prevent obtaining
  informed consent or compliance with trial requirements
- Exclude - 9. Any condition deemed unsuitable for trial participation by the investigator
