status: open to accrual
summary: "The goal of this clinical trial is to evaluate the efficacy and safety of\
  \ venetoclax combined with azacitidine in treating newly diagnosed early T-cell\
  \ precursor (ETP)-like acute lymphoblastic leukemia (ALL), T-ALL with myeloid mutations,\
  \ or T/myeloid mixed-phenotype acute leukemia (T/My-MPAL).\n\nParticipant population:\
  \ Patients aged \u226514 years diagnosed with ETP-like leukemia, T-ALL with myeloid\
  \ mutations, or T/My-MPAL, regardless of sex/gender.\n\nThe main question it aims\
  \ to answer: Does venetoclax plus azacitidine achieve a significantly higher overall\
  \ response rate (ORR: CR + CRi) compared to historical controls (54% vs. 90%) after\
  \ two induction cycles?\n\nComparison group: Researchers will compare ORR outcomes\
  \ to historical data from conventional chemotherapy regimens to assess treatment\
  \ superiority.\n\nParticipants will:\n\n* Receive two 28-day cycles of venetoclax\
  \ (oral, 100 mg D1, 200 mg D2, 400 mg D3-28) and azacitidine (75 mg/m\xB2/day SC,\
  \ D1-7).\n* Undergo serial bone marrow biopsies, blood tests, and imaging (e.g.,\
  \ PET-CT) for response assessment.\n* Follow dose adjustment protocols for toxicity\
  \ management (e.g., neutropenia, thrombocytopenia)."
