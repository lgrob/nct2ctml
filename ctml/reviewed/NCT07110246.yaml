status: open to accrual
summary: 'This phase II trial studies how well de-escalating the drugs dabrafenib
  and trametinib works in treating patients with low-grade gliomas that have a BRAF
  V600 gene mutation. Dabrafenib and trametinib are in a class of medications called
  kinase inhibitors. They work by blocking the action of abnormal proteins that signals
  tumor cells to multiply. This helps stop the spread of tumor cells. This trial may
  help doctors determine the best dosing strategy for patients who have received dabrafenib
  and trametinib for 12-24 months: Either stopping dabrafenib and trametinib completely
  or slowly reducing the dose for an additional 6 months.'
treatment_list:
