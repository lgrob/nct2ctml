    step_code: '1'
    step_type: Registration
    arm:
    - arm_code: 'Cohort 1: Arm A (Newly diagnosed, Dabrafenib, Trametinib followed
        by treatment stop)'
      arm_internal_id: 0
      arm_description: Participants with newly diagnosed BRAF V600 mutant LGGs receive
        dabrafenib PO twice per day (BID) and trametinib PO once daily (QD) on days
        1-28 of each cycle. Cycles repeat every 28 days for a minimum of 12 cycles
        and continues until confirmed best response or for up to a maximum of 24 cycles
        in the absence of disease progression or unacceptable toxicity. Participants
        then stop treatment with dabrafenib and trametinib. Participants also undergo
        ECHO, MRI, and blood sample collection throughout the study and may optionally
        undergo lumbar puncture for collection of CSF.
      arm_suspended: N
