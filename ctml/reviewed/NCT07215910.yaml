status: open to accrual
summary: This phase III trial compares the effect of vorasidenib to placebo in combination
  with usual treatment, temozolomide, in treating patients with newly diagnosed grade
  3 astrocytoma after radiation. Temozolomide is in a class of medications called
  alkylating agents. It works by damaging the cell's deoxyribonucleic acid and may
  kill tumor cells and slow down or stop tumor growth. Vorasidenib citrate blocks
  the proteins made by the mutated IDH1 and IDH2 genes, which may help keep tumor
  cells from growing. It is a type of enzyme inhibitor and a type of targeted therapy.
  Adding vorasidenib to the usual treatment, temozolomide, may be more effective than
  temozolomide alone in treating patients with newly diagnosed grade 3 astrocytoma
  after radiation therapy.
treatment_list:
  step:
  - step_internal_id: 111
    step_code: '1'
    step_type: Registration
    arm:
    - arm_code: Arm I (temozolomide, placebo)
      arm_internal_id: 0
      arm_description: Patients receive IMRT/VMAT or PBS or IMPT QD on Monday-Friday
        for 33 fractions. Starting 4 weeks after radiotherapy, patients receive temozolomide
        PO QD on days 1-5 and placebo PO QD on days 1-28 of each cycle. Cycles of
        combination treatment repeat every 28 days for up to 12 months and placebo
        alone repeats every 28 days in the absence of disease progression or unacceptable
        toxicity. Additionally, patients undergo blood sample collection and MRI throughout
        the study.
      arm_suspended: N
