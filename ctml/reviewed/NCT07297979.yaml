status: open to accrual
summary: The main objectives of this trial are to determine the recommended dose for
  expansion of xaluritamig (dose confirmation part only) and to determine the safety
  and tolerability of xaluritamig in adult, adolescent and pediatric participants
  with relapsed or refractory EWS.
