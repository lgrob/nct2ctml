summary: 'This clinical trial is looking at two drugs called dabrafenib and trametinib.
  Dabrafenib and trametinib are approved as standard of care treatment for adult patients
  with melanoma (a type of skin cancer) or lung cancer and in children with glioma
  (a type of brain tumour). This means they have gone through clinical trials and
  been approved by the Medicines and Healthcare products Regulatory Agency (MHRA)
  in the UK. Dabrafenib and trametinib work in patients with a particular mutation
  in their cancer known as BRAF V600.


  Investigators now wish to find out if they will be useful in treating patients with
  other cancer types which have the same mutation. If the results are positive, the
  study team will work with the NHS and the Cancer Drugs Fund to see if these drugs
  can be routinely accessed for patients in the future.


  This trial is part of a trial programme called DETERMINE. The programme will also
  look at other anti-cancer drugs in the same way, through matching the drug to rare
  cancer types or ones with specific mutations.'
